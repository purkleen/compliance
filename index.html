<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regulatory Risk Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one question per screen in a narrow left-aligned column, centred vertically. Styled with shadcn/ui's zinc tokens and component shapes; light theme only by request. */
:root {
  --background: #ffffff;
  --foreground: #09090b;
  --muted: #f4f4f5;
  --muted-foreground: #71717a;
  --primary: #18181b;
  --primary-foreground: #fafafa;
  --border: #e4e4e7;
  --ring: #a1a1aa;
  --ring-soft: rgba(161, 161, 170, .35);
  --destructive: #dc2626;
  --destructive-border: rgba(220, 38, 38, .45);
  --destructive-tint: #fef2f2;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
  --radius: .5rem;
  --radius-md: calc(var(--radius) - 2px);
  --radius-xl: calc(var(--radius) + 4px);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}

html, body { height: 100%; }
body {
  background: var(--background); color: var(--foreground);
  font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* Progress */
.rail { flex: none; height: 8px; margin: 16px 24px 0; border-radius: 999px; background: var(--muted); overflow: hidden; }
.rail > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .4s ease; }

.top { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 24px; }
.top b { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
/* Badge, secondary */
.tag { background: var(--muted); border-radius: var(--radius-md); padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }

main { flex: 1; min-height: 0; overflow-y: auto; display: flex; padding-inline: 24px; padding-block: 16px; }
.q { --qsize: clamp(20px, 4vw, 24px); margin: auto; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 24px; }
.q.fwd { animation: up .32s cubic-bezier(.2, .7, .2, 1); }
.q.back { animation: down .32s cubic-bezier(.2, .7, .2, 1); }
@keyframes up { from { opacity: 0; transform: translateY(32px); } }
@keyframes down { from { opacity: 0; transform: translateY(-32px); } }
@media (prefers-reduced-motion: reduce) { .q.fwd, .q.back { animation: none; } .rail > i { transition: none; } }

.q.hang { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 20px; }
.q.hang > * { grid-column: 2; justify-self: start; }
.q.hang > .head, .q.hang > .field, .q.hang > .line, .q.hang > .money, .q.hang > .sign, .q.hang > .scale, .q.hang > .opts.wide { justify-self: stretch; }
.q.hang > .num { grid-column: 1; grid-row: 1; }
.head { display: flex; flex-direction: column; gap: 6px; }
.num { font-family: var(--mono); font-size: 13px; line-height: calc(var(--qsize) * 1.3); color: var(--muted-foreground); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
h1 { font-weight: 600; font-size: var(--qsize); line-height: 1.3; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1.big { font-size: clamp(30px, 6.5vw, 40px); font-weight: 700; letter-spacing: -.03em; line-height: 1.12; }
.help { color: var(--muted-foreground); font-size: 15px; margin: 0; max-width: 60ch; }

/* Input, Textarea */
.field { display: flex; flex-direction: column; gap: 8px; }
.line {
  box-sizing: border-box; width: 100%; max-width: 480px; height: 44px; padding: 0 12px;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
textarea.line { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; }
.line::placeholder { color: var(--muted-foreground); }
.line:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.money { display: flex; align-items: center; gap: 8px; }
.money span { color: var(--muted-foreground); font-size: 16px; }
.money .line { max-width: 200px; font-variant-numeric: tabular-nums; }
.tip { font-size: 13px; color: var(--muted-foreground); }
kbd { font-family: var(--mono); font-size: 11px; background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--foreground); }

/* Options: outline rows with a kbd hint */
.opts { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.opts.wide { align-items: stretch; max-width: 420px; }
.opt {
  display: flex; align-items: center; gap: 10px; min-width: 220px; text-align: left; cursor: pointer;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  padding: 9px 12px 9px 9px; font-size: 15px; font-weight: 500; transition: background .12s, border-color .12s;
}
.opt:hover { background: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: var(--muted); }
.key {
  flex: none; width: 22px; height: 22px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; background: var(--muted); border: 1px solid var(--border); border-radius: 4px;
}
.opt[aria-pressed="true"] .key { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.opt .lbl { flex: 1; min-width: 0; }
.opt .tick { visibility: hidden; font-size: 14px; }
.opt[aria-pressed="true"] .tick { visibility: visible; }

.scale { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.scale .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale .opt { min-width: 0; justify-content: center; padding: 12px 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.scale .ends { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted-foreground); }

/* File upload */
.field.upload { gap: 12px; max-width: 520px; }
.drop {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer;
  background: var(--background); border: 1px dashed var(--ring); border-radius: var(--radius); padding: 28px 16px; font-size: 15px;
  transition: background .12s, border-color .12s;
}
.drop:hover, .drop.over { background: var(--muted); border-color: var(--primary); }
.drop:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.drop b { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.pick { position: absolute; width: 1px; height: 1px; opacity: 0; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.files li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; font-size: 14px; }
.files .kind { font-family: var(--mono); font-size: 10.5px; font-weight: 500; background: var(--muted); border-radius: 4px; padding: 3px 0; text-align: center; }
.files .fname { overflow-wrap: anywhere; font-weight: 500; }
.files .size { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.files .rm { width: 28px; height: 28px; background: none; border: 0; border-radius: var(--radius-md); color: var(--muted-foreground); cursor: pointer; font-size: 17px; line-height: 1; }
.files .rm:hover { background: var(--muted); color: var(--destructive); }

/* Per-step attachments and AI follow-up badge */
.q.over { outline: 2px dashed var(--ring); outline-offset: 12px; border-radius: var(--radius); }
.attach-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.attach-btn {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; cursor: pointer;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); font-size: 13px; font-weight: 500;
}
.attach-btn:hover { background: var(--muted); }
.attach-btn:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag.ai { background: var(--background); border: 1px solid var(--border); font-weight: 500; }
.att-note { display: block; color: var(--muted-foreground); font-weight: 400; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* AI follow-up: a short chat under the answer it relates to */
.follow { gap: 14px; max-width: 560px; border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: 14px 16px; animation: up .3s cubic-bezier(.2, .7, .2, 1); }
.log { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; }
.msg p { margin: 0; min-width: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.ai .who { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); font-size: 11px; }
.msg.ai p { padding-top: 1px; font-weight: 500; }
.msg.ai.end p { font-weight: 400; color: var(--muted-foreground); }
.msg.me { justify-content: flex-end; }
.msg.me p { max-width: 85%; background: var(--muted); border-radius: 18px; padding: 8px 14px; }
.msg p.dots { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding-top: 0; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-foreground); animation: blink 1.2s infinite both; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--background); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow-sm); padding: 5px 5px 5px 14px; }
.composer:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.reply { flex: 1; min-width: 0; max-height: 160px; border: 0; background: transparent; resize: none; padding: 6px 0; font-size: 15px; line-height: 1.4; }
.reply:focus { outline: none; }
.reply::placeholder { color: var(--muted-foreground); }
.send { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); cursor: pointer; font-size: 15px; }
.send:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: reduce) { .follow, .dots i { animation: none; } }

/* Dashboard of submitted forms */
.q.wide { max-width: 760px; }
.flist { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.frow:last-child { border-bottom: 0; }
.ftitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 500; }
.fsub { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
@media (max-width: 560px) { .frow { grid-template-columns: minmax(0, 1fr) auto; } .ftext { grid-column: 1 / -1; } }

/* Risk input: four optional fields per risk */
.risk { gap: 16px; max-width: 560px; }
.risk label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
.risk label > span { display: flex; align-items: baseline; gap: 8px; }
.risk .opt-note { color: var(--muted-foreground); font-weight: 400; font-size: 12px; }
.risk .line { max-width: none; min-height: 64px; font-size: 15px; }

.clipwrap { display: block; }
.clip { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; line-clamp: 5; overflow: hidden; white-space: pre-wrap; }
.clip.open { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
.more { display: block; margin-top: 4px; text-decoration: underline; }

/* Checkbox + signature */
.sign { display: flex; flex-direction: column; gap: 20px; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px 16px; font-size: 14px; }
.check input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--primary); flex: none; }
.check span { min-width: 0; }

/* Button */
.go { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn {
  height: 40px; padding: 0 16px; background: var(--primary); color: var(--primary-foreground); border: 1px solid var(--primary);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: pointer; font-size: 14px; font-weight: 500; transition: opacity .12s, background .12s;
}
.btn:hover { opacity: .9; }
.btn.ghost { background: var(--background); color: var(--foreground); border-color: var(--border); }
.btn.ghost:hover { background: var(--muted); opacity: 1; }
.enter { font-size: 13px; color: var(--muted-foreground); }

/* Alert */
.error { background: var(--destructive-tint); color: var(--destructive); border: 1px solid var(--destructive-border); border-radius: var(--radius); padding: 8px 12px; font-size: 14px; font-weight: 500; }
.flags { margin: 0; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 14px; }

.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted-foreground); font-size: 14px; }

/* Card */
.block { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: 16px 20px 6px; }
.grp { font-weight: 600; font-size: 15px; letter-spacing: -.01em; margin: 0; }
.review { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.review > div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.review > div:last-child { border-bottom: 0; }
.review dt { color: var(--muted-foreground); }
.review dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; }
.edit { background: none; border: 0; padding: 0; font-size: 13px; font-weight: 500; cursor: pointer; text-underline-offset: 4px; }
.edit:hover { text-decoration: underline; }
@media (max-width: 520px) { .review > div { grid-template-columns: minmax(0, 1fr) auto; } .review dt { grid-column: 1 / -1; } }

.foot { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 24px; font-size: 13px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.nav { grid-column: 2; display: flex; gap: 6px; }
.nav button { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: pointer; font-size: 13px; font-weight: 500; }
.nav button:hover:not(:disabled) { background: var(--muted); }
@media (max-width: 520px) { .foot { grid-template-columns: 1fr; justify-items: center; gap: 8px; } .nav { grid-column: 1; } }
.nav button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<div class="rail" aria-hidden="true"><i id="bar"></i></div>
<div class="top"><b>Regulatory Risk Assessment</b><span class="tag">Example form</span></div>
<main id="stage"></main>
<div class="foot">
  <span id="count"></span>
  <div class="nav">
    <button type="button" class="act" id="prev" ><span aria-hidden="true">&#8593;</span> Previous</button>
    <button type="button" class="act" id="next" ><span aria-hidden="true">&#8595;</span> Next</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {

  function key(v) { return v && typeof v === 'object' ? JSON.stringify(v) : String(v); }
  function riskHas(v) { return !!v && RISK_FIELDS.some(function (f) { return (v[f[0]] || '').trim(); }); }
  function risk(id, sub, short, title, help) {
    return { id: id, type: 'risk', sub: sub, short: short, title: title, help: help || RISK_HELP, ai: true, aiWhen: riskHas, fallback: RISK_FOLLOW };
  }
  var Q = [
    { id: 'name', type: 'text', short: 'Full name', title: 'First, what is your full name?', help: 'We use your name and email to confirm who submitted this assessment.', ph: 'Type your answer here…', ac: 'name' },
    { id: 'email', type: 'email', short: 'Work email', title: 'Thanks, {first}. What is your work email?', ph: 'name@company.com', ac: 'email' },
    { id: 'area', type: 'choice', optional: true, short: 'Area of the company', title: 'Which area of the company are you answering for?', help: 'Pick the area you know best. Your risk input will be read in that context.', opts: ['HR and People', 'Finance', 'Legal and Compliance', 'Procurement and Supply Chain', 'Sales and Marketing', 'IT and Data', 'Operations', 'Other'] },

    risk('r_labour', 'Regulatory', 'Labour law changes', 'Inadequate adaptation to upcoming changes in labour law (including mobbing definition)'),

    risk('r_latepay', 'Regulatory', 'Late-payment regulations', 'Insufficient monitoring of the ongoing EU work on new late-payment regulations'),
    risk('r_dynamic', 'Regulatory', 'Dynamic regulatory environment', 'Dynamic regulatory environment in the area of compliance'),

  ];

  var GROUPS = [
    ['About you', ['name', 'email', 'area']],
    ['Regulatory risks', ['r_equalpay', 'r_aiact', 'r_ecgt', 'r_labour', 'r_anticorruption', 'r_latepay', 'r_dynamic']],
    ['Systemic risks', ['r_unknown']]
  ];
  var ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,image/*,video/*,audio/*';
  var MAX_FILES = 10, MAX_BYTES = 100 * 1024 * 1024;
  var EXT_KIND = { pdf: 'PDF', doc: 'DOC', docx: 'DOC', txt: 'DOC', xls: 'SHEET', xlsx: 'SHEET', csv: 'SHEET', ppt: 'SLIDES', pptx: 'SLIDES' };

  function kindOf(f) {
    var t = f.type || '', ext = (f.name.split('.').pop() || '').toLowerCase();
    if (t.indexOf('video/') === 0) return 'VIDEO';
    if (t.indexOf('audio/') === 0) return 'AUDIO';
    if (t.indexOf('image/') === 0) return 'IMAGE';
    return EXT_KIND[ext] || '';
  }
  function sizeOf(n) {
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    return Math.max(1, Math.round(n / 1024)) + ' KB';
  }

  var state = { answers: {}, at: 'welcome', files: {}, fu: {}, edited: {}, editing: false };
  var snap = '', snapEmpty = true, focusRow = null;
  var busy = null;
  var sampleP = window.claude && window.claude.use ? window.claude.use('sample').catch(function () { return null; }) : Promise.resolve(null);
  var stage = document.getElementById('stage');
  var errMsg = '';
  var autoTimer = null;

  function useCap(name) {
    return window.claude && window.claude.use ? window.claude.use(name).catch(function () { return null; }) : Promise.resolve(null);
  }
  // Submitted forms live in the viewer's private subtree of the artifact database; browser storage is the fallback.
  var EXAMPLES = [
    { id: 'ex-2026a', example: true, title: 'Risk assessment: Upcoming Legal and Systemic Changes', ref: 'RSK-2026-0412', submittedAt: Date.UTC(2026, 3, 14, 9, 41), risks: 3, total: 8, rows: [
      { group: 'About you', label: 'Full name', value: 'Sample Employee' },
      { group: 'About you', label: 'Area of the company', value: 'HR and People' },
      { group: 'Regulatory risks', label: 'Equal pay transparency', value: 'Risk description: Pay bands are not documented for every role, so we may be unable to justify pay differences once reporting starts.\nRisk drivers: Legacy salary agreements and no shared job architecture.\nOpportunities: A clear pay structure would help hiring and retention.\nRisk source: EU Pay Transparency Directive', thread: [{ q: 'How likely is this to affect your area in the next 12 months?', a: 'Very likely. The first report is due next year.' }], files: ['pay-band-audit.xlsx'] },
      { group: 'Regulatory risks', label: 'Labour law changes', value: 'Risk description: Managers have not been trained on the new mobbing definition.\nRisk drivers: High manager turnover.\nRisk source: Upcoming labour code amendment' },
      { group: 'Systemic risks', label: 'Unknown unknowns', value: 'Risk description: Works council rules for AI tools used in hiring are still unclear.' }
    ] },

  }
  function showError() {
    var box = document.getElementById('err');
    if (!box) return;
    box.textContent = errMsg;
    box.hidden = !errMsg;
  }
  function clearError() { if (errMsg) { errMsg = ''; showError(); } }

  function pick(q, v) {
    var a = state.answers;
    if (busy) return;
    if (q.type === 'multi') {
      var cur = (a[q.id] || []).slice(), i = cur.indexOf(v);
      if (i >= 0) cur.splice(i, 1);
      else if (v === 'none') cur = ['none'];
      else { cur = cur.filter(function (x) { return x !== 'none'; }); cur.push(v); }
      a[q.id] = cur;
    } else {
      a[q.id] = v;
    }
    clearError();
    syncPressed(q);
    syncFu(q);
    if (q.type !== 'multi') {
      clearTimeout(autoTimer);
      autoTimer = setTimeout(next, 380);
    }
  }
  function syncPressed(q) {
    var v = state.answers[q.id];
    stage.querySelectorAll('.opt').forEach(function (b) {
      var on = q.type === 'multi' ? (v || []).indexOf(b.dataset.v) >= 0 : String(v) === b.dataset.v;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function okRow(label, hint) {
    return h('div', { class: 'go' },
      h('button', { type: 'button', class: 'btn act', id: 'ok', onclick: next, text: label }),
      h('span', { class: 'enter' }, 'press ', h('kbd', { text: 'Enter ↵' }), hint ? ' ' + hint : ''));
  }

  function addFiles(q, incoming, listEl) {
    var cur = (state.files[q.id] || []).slice(), msg = '';
    Array.prototype.forEach.call(incoming || [], function (f) {
      if (!kindOf(f)) msg = '\u201C' + f.name + '\u201D is not a supported file type.';
      else if (f.size > MAX_BYTES) msg = '\u201C' + f.name + '\u201D is larger than 100 MB.';
      else if (cur.length >= MAX_FILES) msg = 'You can attach up to ' + MAX_FILES + ' files to one answer.';
      else if (!cur.some(function (c) { return c.name === f.name && c.size === f.size; })) cur.push(f);
    });
    state.files[q.id] = cur;
    errMsg = msg;
    showError();
    drawFiles(q, listEl);
  }
  function drawFiles(q, listEl) {
    var cur = state.files[q.id] || [];
    listEl.replaceChildren();
    listEl.hidden = !cur.length;
    cur.forEach(function (f, i) {
      listEl.appendChild(h('li', null,
        h('span', { class: 'kind', text: kindOf(f) }),
        h('span', { class: 'fname', text: f.name }),
        h('span', { class: 'size', text: sizeOf(f.size) }),
        h('button', { type: 'button', class: 'rm act', id: 'rm-' + i, 'aria-label': 'Remove ' + f.name, text: '\u00D7', onclick: function () {
          var left = (state.files[q.id] || []).slice();
          left.splice(i, 1);
          state.files[q.id] = left;
          clearError();
          drawFiles(q, listEl);
        } })));
    });
  }
  function attachRow(q, sec) {
    var fl = h('ul', { class: 'files', id: 'att-' + q.id + '-list' });
    var input = h('input', { type: 'file', class: 'pick act', id: 'att-' + q.id, multiple: true, accept: ACCEPT, 'aria-label': 'Attach media or documents to this answer',
      onchange: function (e) { addFiles(q, e.target.files, fl); e.target.value = ''; } });
    sec.addEventListener('dragover', function (e) { e.preventDefault(); sec.classList.add('over'); });
    sec.addEventListener('dragleave', function (e) { if (!sec.contains(e.relatedTarget)) sec.classList.remove('over'); });
    sec.addEventListener('drop', function (e) { e.preventDefault(); sec.classList.remove('over'); addFiles(q, e.dataTransfer && e.dataTransfer.files, fl); });
    drawFiles(q, fl);
    return h('div', { class: 'field attach' },
      h('div', { class: 'attach-top' },
        h('label', { class: 'attach-btn', for: 'att-' + q.id }, input, h('span', { 'aria-hidden': 'true', text: '+' }), 'Attach media or documents'),
        h('span', { class: 'tip', text: 'Optional. You can also drop files anywhere on this step.' })),
      fl);
  }

  function control(q) {
    var a = state.answers, el;
    if (q.type === 'risk') {
      var wrap = h('div', { class: 'field risk' });
      RISK_FIELDS.forEach(function (f) {
        var ta = h('textarea', { class: 'line', id: 'f-' + q.id + '-' + f[0], rows: '2', placeholder: f[2],
          oninput: function (e) { a[q.id] = a[q.id] || {}; a[q.id][f[0]] = e.target.value; clearError(); syncFu(q); } });
        ta.value = (a[q.id] || {})[f[0]] || '';
        wrap.appendChild(h('label', { for: 'f-' + q.id + '-' + f[0] }, h('span', null, f[1], h('span', { class: 'opt-note', text: 'Optional' })), ta));
      });
      wrap.appendChild(h('span', { class: 'tip' }, h('kbd', { text: 'Shift \u21E7 + Enter \u21B5' }), ' to make a line break'));
      return wrap;
    }
    if (q.type === 'text' || q.type === 'email' || q.type === 'money') {
      el = h('input', {
        class: 'line', id: 'f-' + q.id, type: q.type === 'email' ? 'email' : 'text',
        inputmode: q.type === 'money' ? 'decimal' : null, placeholder: q.ph, autocomplete: q.ac || 'off',
        'aria-label': q.short,
        oninput: function (e) { a[q.id] = e.target.value; clearError(); syncFu(q); }
      });
      el.value = a[q.id] || '';
      return q.type === 'money' ? h('div', { class: 'money' }, h('span', { text: '€' }), el) : el;
    }
    if (q.type === 'long') {
      el = h('textarea', {
        class: 'line', id: 'f-' + q.id, rows: '3', placeholder: q.ph, 'aria-label': q.short,
        oninput: function (e) { a[q.id] = e.target.value; clearError(); syncFu(q); }
      });
      el.value = a[q.id] || '';
      return h('div', { class: 'field' }, el,
        h('span', { class: 'tip' }, h('kbd', { text: 'Shift ⇧ + Enter ↵' }), ' to make a line break'));
    }
    if (q.type === 'scale') {
      var row = h('div', { class: 'row' });
      for (var n = 1; n <= 5; n++) (function (n) {
        row.appendChild(h('button', { type: 'button', class: 'opt', id: 'f-' + q.id + '-' + n, 'data-v': String(n), 'aria-pressed': 'false', 'aria-label': n + ' out of 5', onclick: function () { pick(q, String(n)); }, text: String(n) }));
      })(n);
      return h('div', { class: 'scale' }, row,
        h('div', { class: 'ends' }, h('span', { text: q.lo }), h('span', { text: q.hi })));
    }
    if (q.type === 'sign') {
      var box = h('input', { type: 'checkbox', id: 'f-declareOk', onchange: function (e) { a.declareOk = e.target.checked; clearError(); } });
      box.checked = !!a.declareOk;
      var sig = h('input', { class: 'line', id: 'f-signature', type: 'text', placeholder: 'Type your full name', autocomplete: 'off', 'aria-label': 'Signature', oninput: function (e) { a.signature = e.target.value; clearError(); } });
      sig.value = a.signature || '';
      return h('div', { class: 'sign' },
        h('label', { class: 'check', for: 'f-declareOk' }, box,
          h('span', { text: 'I confirm that my answers are true and complete to the best of my knowledge, and that I will tell Compliance within 10 working days if anything changes.' })),
        h('div', { class: 'field' }, sig, h('span', { class: 'tip', text: 'Typing your name counts as your signature. Signed on ' + today() + '.' })));
    }
    var list = h('div', { class: 'opts' + (q.type === 'multi' ? ' wide' : '') });
    opts(q).forEach(function (o, i) {
      list.appendChild(h('button', { type: 'button', class: 'opt', id: 'f-' + q.id + '-' + i, 'data-v': o.v, 'aria-pressed': 'false', onclick: function () { pick(q, o.v); } },
        h('span', { class: 'key', 'aria-hidden': 'true', text: o.k }),
        h('span', { class: 'lbl', text: o.l }),
        h('span', { class: 'tick', 'aria-hidden': 'true', text: '✓' })));
    });
    return list;
  }

  function today() {
    return new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function display(q) {
    var a = state.answers, v = a[q.id];
    if (q.type === 'risk') {
      return RISK_FIELDS.filter(function (f) { return v && (v[f[0]] || '').trim(); }).map(function (f) { return f[1] + ': ' + v[f[0]].trim(); }).join('\n') || 'No input';
    }
    if (q.type === 'sign') return 'Signed by ' + (a.signature || '').trim() + ', ' + today();
    if (q.type === 'money') return '€' + String(v).trim();
    if (q.type === 'scale') return v + ' out of 5';
    if (q.type === 'multi') return opts(q).filter(function (o) { return v.indexOf(o.v) >= 0; }).map(function (o) { return o.l; }).join(', ');
    if (q.type === 'yesno' || q.type === 'choice') {
      var m = opts(q).filter(function (o) { return o.v === v; })[0];
      return m ? m.l : 'Not specified';
    }
    return String(v || '').trim();
  }

  function render(dir) {
    var vis = visible(), q = qById(state.at), sec = h('section', { class: 'q ' + dir }), s = steps();
    if (s.indexOf(state.at) < 0) state.at = 'welcome';

    if (state.at === 'welcome') {
      var nRisks = Q.filter(function (x) { return x.type === 'risk'; }).length;
      sec.appendChild(h('div', { class: 'head' },
        h('div', { class: 'badges' }, h('span', { class: 'tag', text: 'Risk management matrix' })),
        h('h1', { class: 'big', text: 'Risk assessment: upcoming legal and systemic changes' }),
        h('p', { class: 'help', text: 'Tell us how each risk in this part of the matrix looks from your area: what it is, what drives it, where it comes from and any opportunities. After your name, email and area, every question is optional.' })));
      sec.appendChild(h('div', { class: 'meta' },
        h('span', { text: nRisks + ' risks' }),
        h('span', { text: 'About 10 minutes' }),
        h('span', { text: 'Skip any risk you have nothing to add to' })));
      var startRow = okRow('Start', '');
      startRow.appendChild(h('button', { type: 'button', class: 'btn ghost act', id: 'to-dash', onclick: function () { go('dashboard', 'fwd'); }, text: 'View previous forms' }));
      sec.appendChild(startRow);
    } else if (state.at === 'review') {
      var flagged = vis.filter(function (x) { return x.flag && x.flag.indexOf(state.answers[x.id]) >= 0; });
      sec.appendChild(h('div', { class: 'head' },
        h('h1', { text: 'Check your answers before you submit.' })));
      var withInput = vis.filter(function (x) { return x.type === 'risk' && riskHas(state.answers[x.id]); }).length;
      sec.appendChild(h('p', { class: 'flags', text: 'You added input on ' + withInput + ' of ' + vis.filter(function (x) { return x.type === 'risk'; }).length + ' risks. Risks you skipped are submitted as \u201CNo input\u201D.' }));

      GROUPS.forEach(function (g) {
        var rows = vis.filter(function (x) { return g[1].indexOf(x.parent || x.id) >= 0; });
        if (!rows.length) return;
        var dl = h('dl', { class: 'review' });
        rows.forEach(function (x) {
          dl.appendChild(h('div', null,
            h('dt', { text: x.short }),
            h('dd', null, clipped(display(x)), (state.files[x.id] || []).length ? h('span', { class: 'att-note', text: 'Attached: ' + state.files[x.id].map(function (f) { return f.name; }).join(', ') }) : null,
              state.edited[x.id] ? h('span', { class: 'att-note', text: 'Edited ' + stamp(state.edited[x.id]) }) : null),
            h('button', { type: 'button', class: 'edit act', id: 'edit-' + x.id, 'aria-label': 'Edit ' + x.short, onclick: function () { state.editing = true; go(x.id, 'back'); }, text: 'Edit' })));
          if (fuActive(x)) pairs(x).forEach(function (t) {
            dl.appendChild(h('div', null,
              h('dt', { text: '↳ ' + t.q }),
              h('dd', null, clipped(t.a || 'Not answered')),
              h('span')));
          });
        });
        sec.appendChild(h('div', { class: 'block' }, h('h2', { class: 'grp', text: g[0] }), dl));
      });
      sec.appendChild(okRow('Submit', ''));
    } else if (state.at === 'dashboard') {
      dashboard(sec);
    } else {
      var n = vis.indexOf(q) + 1;
      sec.classList.add('hang');
      if (dir !== 'stay') { snap = sig(q); snapEmpty = q.type !== 'sign' && q.type !== 'risk' && state.answers[q.id] == null; }
      sec.appendChild(h('div', { class: 'num' }, String(n), h('span', { 'aria-hidden': 'true', text: '→' })));
      sec.appendChild(h('div', { class: 'head' },
        q.type === 'risk' ? h('div', { class: 'badges' }, h('span', { class: 'tag', text: q.sub }), h('span', { class: 'tip', text: MATRIX })) : null,
        h('h1', { text: fill(q.title) }),
        q.help ? h('p', { class: 'help', text: q.help }) : null));
      sec.appendChild(control(q));
      if (fuActive(q)) sec.appendChild(followBlock(q));
      if (q.type === 'risk') sec.appendChild(attachRow(q, sec));
      var err = h('div', { class: 'error', id: 'err', role: 'alert', text: errMsg });
      err.hidden = !errMsg;
      sec.appendChild(err);
      var okLine = okRow(state.editing ? 'Save and return' : vis.indexOf(q) === vis.length - 1 ? 'Review answers' : 'OK ✓', '');
      if (q.type === 'risk' || q.optional) okLine.insertBefore(h('button', { type: 'button', class: 'btn ghost act', id: 'skip', onclick: function () { skipQuestion(q); }, text: 'Skip' }), okLine.children[1]);
      sec.appendChild(okLine);
    }

    stage.replaceChildren(sec);
    stage.scrollTop = 0;
    stage.querySelectorAll('.clip').forEach(function (c) {
      if (c.scrollHeight > c.clientHeight + 2 && c.nextSibling) c.nextSibling.hidden = false;
    });
    if (state.at === 'review' && focusRow) {
      var row = document.getElementById('edit-' + focusRow);
      if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
      focusRow = null;
    }
    if (q && q.type !== 'text' && q.type !== 'email' && q.type !== 'money' && q.type !== 'long' && q.type !== 'sign') syncPressed(q);

    var i = s.indexOf(state.at), qi = q ? vis.indexOf(q) : -1;
    var done = state.at === 'welcome' ? 0 : (state.at === 'review' || state.at === 'dashboard') ? vis.length : qi;
    document.getElementById('bar').style.width = (100 * done / vis.length) + '%';
    document.getElementById('count').textContent = q ? 'Question ' + (qi + 1) + ' of ' + vis.length
      : state.at === 'review' ? 'Review' : state.at === 'dashboard' ? 'Your forms' : vis.length + ' questions';
    document.getElementById('prev').disabled = i <= 0 || state.at === 'dashboard';
    document.getElementById('next').disabled = state.at === 'review' || state.at === 'dashboard';

    var focusEl = stage.querySelector('input.line, textarea.line');
    if (q && q.type === 'sign') focusEl = null;
    var fuEl = q && document.getElementById('f-' + q.id + '__fu');
    if (fuEl && (dir === 'stay' || !stage.querySelector('input.line'))) focusEl = fuEl;
    if (focusEl) { try { focusEl.focus({ preventScroll: true }); } catch (e) { focusEl.focus(); } }
    else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('next').addEventListener('click', next);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target, tag = t.tagName, typing = tag === 'TEXTAREA' || (tag === 'INPUT' && t.type !== 'checkbox');
    if (e.key === 'Enter') {
      if (tag === 'TEXTAREA' && e.shiftKey) return;
      if (t.classList && t.classList.contains('act')) return;
      if (t.id && /__fu$/.test(t.id) && t.value.trim()) { e.preventDefault(); var cq = qById(state.at); if (cq) sendReply(cq); return; }
      e.preventDefault();
      next();
      return;
    }
    if (typing) return;
    var q = qById(state.at);
    if (!q) return;
    var key = e.key.toUpperCase(), hit;
    if (q.type === 'scale') {
      if (/^[1-5]$/.test(key)) { e.preventDefault(); pick(q, key); }
    } else if (q.type === 'yesno' || q.type === 'choice' || q.type === 'multi') {
      hit = opts(q).filter(function (o) { return o.k === key; })[0];
      if (hit) { e.preventDefault(); pick(q, hit.v); }
    }
  });

  function start(data) {
    if (data && data.answers) state.answers = data.answers;
    if (data && data.fu) state.fu = data.fu;
    if (data && data.edited) state.edited = data.edited;
    if (data && data.editing) state.editing = true;
    if (data && data.at) state.at = data.at;
    render('fwd');
  }
  var hot = window.claude && window.claude.hot;
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); });
  if (hot && hot.snapshot) hot.snapshot(function () {
    var keep = {}, k;
    for (k in state.answers) if (k !== 'files') keep[k] = state.answers[k];
    return { answers: keep, fu: state.fu, edited: state.edited, editing: state.editing, at: state.at };
  });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
