<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Assessment: Free hand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one question per screen in a narrow left-aligned column, centred vertically. Styled with shadcn/ui's zinc tokens and component shapes; light theme only by request. */
:root {
  --background: #ffffff;
  --foreground: #09090b;
  --muted: #f4f4f5;
  --muted-foreground: #71717a;
  --primary: #18181b;
  --primary-foreground: #fafafa;
  --border: #e4e4e7;
  --ring: #a1a1aa;
  --ring-soft: rgba(161, 161, 170, .35);
  --destructive: #dc2626;
  --destructive-border: rgba(220, 38, 38, .45);
  --destructive-tint: #fef2f2;
  --success: #15803d;
  --success-border: rgba(22, 163, 74, .4);
  --success-tint: #f0fdf4;
  --c1: #2563eb; --c2: #b45309; --c3: #047857; --c4: #be185d; --c5: #6d28d9; --c6: #0e7490;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
  --radius: .5rem;
  --radius-md: calc(var(--radius) - 2px);
  --radius-xl: calc(var(--radius) + 4px);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}

/* Dark theme, switched by the button in the top bar (light is the default) */
:root.dark {
  --background: #09090b;
  --foreground: #fafafa;
  --muted: #1e1e22;
  --muted-foreground: #a1a1aa;
  --primary: #fafafa;
  --primary-foreground: #18181b;
  --border: #303036;
  --ring: #71717a;
  --ring-soft: rgba(113, 113, 122, .4);
  --destructive: #f87171;
  --destructive-border: rgba(248, 113, 113, .45);
  --destructive-tint: #2a1215;
  --success: #4ade80;
  --success-border: rgba(74, 222, 128, .35);
  --success-tint: #0f2417;
  --c1: #60a5fa; --c2: #fbbf24; --c3: #34d399; --c4: #f472b6; --c5: #a78bfa; --c6: #22d3ee;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

/* The whole page scrolls; no pane has its own scrollbar. */
html { height: 100%; }
body { min-height: 100%; }
body {
  background: var(--background); color: var(--foreground);
  font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* Progress */
.rail { flex: none; height: 8px; margin: 16px 24px 0; border-radius: 999px; background: var(--muted); overflow: hidden; }
.rail > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .4s ease; }

.top { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 24px; }
.top b { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
/* Badge, secondary */
.tag { background: var(--muted); border-radius: var(--radius-md); padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }

main { flex: 1 0 auto; display: flex; padding-inline: 24px; padding-block: 16px; }
.q { --qsize: clamp(20px, 4vw, 24px); margin: auto; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 24px; }
.q.fwd { animation: up .32s cubic-bezier(.2, .7, .2, 1); }
.q.back { animation: down .32s cubic-bezier(.2, .7, .2, 1); }
@keyframes up { from { opacity: 0; transform: translateY(32px); } }
@keyframes down { from { opacity: 0; transform: translateY(-32px); } }
@media (prefers-reduced-motion: reduce) { .q.fwd, .q.back { animation: none; } .rail > i { transition: none; } }

.q.hang { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 20px; }
.q.hang > * { grid-column: 2; justify-self: start; }
.q.hang > .head, .q.hang > .field, .q.hang > .line, .q.hang > .money, .q.hang > .sign, .q.hang > .scale, .q.hang > .opts.wide { justify-self: stretch; }
.q.hang > .num { grid-column: 1; grid-row: 1; }
.head { display: flex; flex-direction: column; gap: 6px; }
.num { font-family: var(--mono); font-size: 13px; line-height: calc(var(--qsize) * 1.3); color: var(--muted-foreground); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
h1 { font-weight: 600; font-size: var(--qsize); line-height: 1.3; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1.big { font-size: clamp(30px, 6.5vw, 41px); font-weight: 700; letter-spacing: -.03em; line-height: 1.12; }
.help { color: var(--muted-foreground); font-size: 15px; margin: 0; max-width: 60ch; }

/* Input, Textarea */
.field { display: flex; flex-direction: column; gap: 8px; }
.line {
  box-sizing: border-box; width: 100%; max-width: 480px; height: 44px; padding: 0 12px;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
textarea.line { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; }
.line::placeholder { color: var(--muted-foreground); }
.line:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.money { display: flex; align-items: center; gap: 8px; }
.money span { color: var(--muted-foreground); font-size: 16px; }
.money .line { max-width: 200px; font-variant-numeric: tabular-nums; }
.tip { font-size: 13px; color: var(--muted-foreground); }
kbd { font-family: var(--mono); font-size: 11px; background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--foreground); }

/* Options: outline rows with a kbd hint */
.opts { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.opts.wide { align-items: stretch; max-width: 420px; }
.opt {
  display: flex; align-items: center; gap: 10px; min-width: 220px; text-align: left; cursor: pointer;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  padding: 9px 12px 9px 9px; font-size: 15px; font-weight: 500; transition: background .12s, border-color .12s;
}
.opt:hover { background: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: var(--muted); }
.key {
  flex: none; width: 22px; height: 22px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; background: var(--muted); border: 1px solid var(--border); border-radius: 4px;
}
.opt[aria-pressed="true"] .key { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.opt .lbl { flex: 1; min-width: 0; }
.opt .tick { visibility: hidden; font-size: 14px; }
.opt[aria-pressed="true"] .tick { visibility: visible; }

.scale { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.scale .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale .opt { min-width: 0; justify-content: center; padding: 12px 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.scale .ends { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted-foreground); }

/* File upload */
.field.upload { gap: 12px; max-width: 520px; }
.drop {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer;
  background: var(--background); border: 1px dashed var(--ring); border-radius: var(--radius); padding: 28px 16px; font-size: 15px;
  transition: background .12s, border-color .12s;
}
.drop:hover, .drop.over { background: var(--muted); border-color: var(--primary); }
.drop:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.drop b { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.pick { position: absolute; width: 1px; height: 1px; opacity: 0; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.files li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; font-size: 14px; }
.files .kind { font-family: var(--mono); font-size: 10.5px; font-weight: 500; background: var(--muted); border-radius: 4px; padding: 3px 0; text-align: center; }
.files .fname { overflow-wrap: anywhere; font-weight: 500; }
.files .size { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.files .rm { width: 28px; height: 28px; background: none; border: 0; border-radius: var(--radius-md); color: var(--muted-foreground); cursor: pointer; font-size: 17px; line-height: 1; }
.files .rm:hover { background: var(--muted); color: var(--destructive); }

/* Per-step attachments and AI follow-up badge */
.q.over { outline: 2px dashed var(--ring); outline-offset: 12px; border-radius: var(--radius); }
.attach-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.attach-btn {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; cursor: pointer;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); font-size: 13px; font-weight: 500;
}
.attach-btn:hover { background: var(--muted); }
.attach-btn:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag.ai { background: var(--background); border: 1px solid var(--border); font-weight: 500; }
.att-note { display: block; color: var(--muted-foreground); font-weight: 400; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* AI follow-up: a short chat under the answer it relates to */
.follow { gap: 14px; max-width: 560px; border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: 14px 16px; animation: up .3s cubic-bezier(.2, .7, .2, 1); }
.log { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; }
.msg p { margin: 0; min-width: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.ai .who { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); font-size: 11px; }
.msg.ai p { padding-top: 1px; font-weight: 500; }
.msg.ai.end p { font-weight: 400; color: var(--muted-foreground); }
.msg.me { justify-content: flex-end; }
.msg.me p { max-width: 85%; background: var(--muted); border-radius: 18px; padding: 8px 14px; }
.msg p.dots { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding-top: 0; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-foreground); animation: blink 1.2s infinite both; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--background); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow-sm); padding: 5px 5px 5px 14px; }
.composer:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.reply { flex: 1; min-width: 0; max-height: 160px; border: 0; background: transparent; resize: none; padding: 6px 0; font-size: 15px; line-height: 1.4; }
.reply:focus { outline: none; }
.reply::placeholder { color: var(--muted-foreground); }
.send { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); cursor: pointer; font-size: 15px; }
.send:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: reduce) { .follow, .dots i { animation: none; } }

/* Dashboard of submitted forms */
.q.wide { max-width: 760px; }
.flist { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.ftext { flex: 1 1 240px; min-width: 0; }
.frow:last-child { border-bottom: 0; }
.ftitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 500; }
.fsub { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }

/* Risk input: four optional fields per risk */
.risk { gap: 16px; max-width: 560px; }
.risk label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
.risk label > span { display: flex; align-items: baseline; gap: 8px; }
.risk .opt-note { color: var(--muted-foreground); font-weight: 400; font-size: 12px; }
.risk .line { max-width: none; min-height: 64px; font-size: 15px; }

.clipwrap { display: block; }
.clip { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; line-clamp: 5; overflow: hidden; white-space: pre-wrap; }
.clip.open { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
.more { display: block; margin-top: 4px; text-decoration: underline; }

/* View switch (Tabs) and the reviewer split screen */
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--muted); border-radius: var(--radius); }
.tabs button { height: 30px; padding: 0 12px; border: 0; background: transparent; border-radius: var(--radius-md); color: var(--muted-foreground); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
main.rvmode { padding-block: 4px 20px; }
.rv { width: 100%; max-width: 1180px; min-height: 0; margin: 0 auto; display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); border: 1px solid var(--border); border-radius: var(--radius-xl); }
.rv-list { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
.rv-head { display: flex; border-top-left-radius: calc(var(--radius-xl) - 1px); align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; background: var(--background); border-bottom: 1px solid var(--border); }
.rv-pad { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.rv-item { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.rv-item:hover, .rv-item[aria-current="true"] { background: var(--muted); }
.rv-item:disabled { opacity: .5; cursor: default; }
.rv-item:focus-visible { outline-offset: -2px; }
.rv-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
.rv-detail { display: flex; flex-direction: column; gap: 16px; padding: 20px 24px 28px; }
.rv-detail h1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 22px; }
.rv-over { margin: 0; background: var(--muted); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; }
.rv-detail .grp { margin-top: 6px; }
.rv-row { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--border); }
.rv-row h3 { margin: 0; font-size: 14px; font-weight: 600; }
.rv-text { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv-text.none, .rv-sub { color: var(--muted-foreground); }
.rv-sub { margin: 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv-detail .line { max-width: none; min-height: 110px; font-size: 14px; }
.rv-back { display: none; align-self: flex-start; }
@media (max-width: 760px) {
  .rv { grid-template-columns: minmax(0, 1fr); border: 0; border-radius: 0; overflow: visible; }
  .rv-list { border-right: 0; overflow: visible; }
  .rv-detail { display: none; overflow: visible; padding: 4px 0 20px; }
  .rv.show-detail .rv-list { display: none; }
  .rv.show-detail .rv-detail { display: flex; }
  .rv-back { display: block; }
}

/* Regenerate for another area */
.ctx { gap: 6px; max-width: 560px; background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; }
.ctx b { font-size: 13px; }
.rg-list { display: flex; flex-direction: column; gap: 8px; }
.rg-list .check b { display: block; margin-bottom: 2px; }
.rg-list .clip { color: var(--muted-foreground); font-size: 13px; }
.rv-detail .opts.wide { max-width: 420px; }
.rv-detail .risk { max-width: 520px; }
.rv-detail .risk .line { min-height: 72px; }

.top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.theme { width: 36px; height: 36px; display: grid; place-items: center; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: pointer; }
.theme:hover, .theme[aria-pressed="true"] { background: var(--muted); }

/* Tagging view and tag manager */
.tg { width: 100%; max-width: 1180px; min-height: 0; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.tg > .rv { flex: 1; }
.tg-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.rv.single { grid-template-columns: minmax(0, 1fr); }
.rv-over > p { margin: 0; }
.rv-over > p + p, .rv-over-list + p { margin-top: 8px; }
.rv-over-list { margin: 6px 0 0; padding-left: 20px; }
.rv-over-list li { margin: 2px 0; line-height: 1.5; }
.rv-over-more { margin-top: 4px; font-size: 14px; text-decoration: underline; }
.rv-over b { display: block; font-size: 13px; margin-bottom: 2px; }
.rv-over .tip { display: block; margin-top: 4px; }
.rv-row h3 .opt-note, .grp .opt-note { margin-left: 8px; color: var(--muted-foreground); font-weight: 400; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 30px; padding: 5px 12px; text-align: left; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 15px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chip:hover { background: var(--muted); }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.chip-edit { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 2px 4px 2px 12px; background: var(--background); border: 1px solid var(--border); border-radius: 16px; }
.chip-edit:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.chip-edit input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 4px 0; font-size: 13px; font-weight: 500; }
.chip-edit input:focus { outline: none; }
.chip-edit .n { color: var(--muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip-edit button { flex: none; min-width: 24px; height: 24px; padding: 0 6px; border: 0; border-radius: 12px; background: none; color: var(--muted-foreground); font-size: 15px; line-height: 1; cursor: pointer; }
.chip-edit button:hover { background: var(--muted); color: var(--destructive); }
.chip-edit button.ask { color: var(--destructive); font-size: 12px; font-weight: 500; }
.tg-group { padding-bottom: 14px; }
.tg-add { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rv-detail .tg-add .line { height: 32px; min-height: 0; max-width: 240px; font-size: 13px; }
@media (max-width: 760px) { .rv.single .rv-detail { display: flex; } }

.chip-areas, .tg-parts { display: flex; flex-direction: column; gap: 12px; }
.chip-area, .tg-part { display: flex; flex-direction: column; gap: 6px; }
.chip-area .cap, .tg-part .cap { color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
.tg-part + .tg-part { padding-top: 12px; border-top: 1px solid var(--border); }

/* Labeling screen (after Label Studio): palette, text regions, regions panel */
.c1 { --c: var(--c1); } .c2 { --c: var(--c2); } .c3 { --c: var(--c3); } .c4 { --c: var(--c4); } .c5 { --c: var(--c5); } .c6 { --c: var(--c6); }
.lb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lb-nav { display: flex; align-items: center; gap: 8px; }
.tag.done { background: var(--success-tint); color: var(--success); }
.lb-wrap { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; }
.lb-main { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.lb-side { flex: 1 1 220px; max-width: 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.lb-palette { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.lb-grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lb-grp .cap { width: 100%; color: var(--muted-foreground); font-size: 12px; }
.lbl { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 6px 3px 9px; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }

/* Summary sources: citation chips in the text and a list of source cards */
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 3px; padding: 0 5px; vertical-align: 1px; background: var(--border); color: var(--muted-foreground); border: 0; border-radius: 9px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; cursor: pointer; }

.srcs { display: flex; flex-direction: column; gap: 10px; }
.src-toggle { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-sm); font-size: 13px; font-weight: 500; cursor: pointer; }

.src-ico { flex: none; min-width: 20px; height: 20px; padding: 0 3px; display: inline-grid; place-items: center; border-radius: 6px; background: color-mix(in srgb, var(--c) 20%, var(--background)); color: var(--c); font-family: var(--mono); font-size: 9px; font-weight: 600; line-height: 1; }

.src-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.src { min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; text-align: left; background: var(--background); color: inherit; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
.src:hover { background: var(--muted); }
.src-top { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12px; }
.src-top .src-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-top .n { margin-left: auto; }
.src-title, .src-snip { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.src-title { -webkit-line-clamp: 2; line-clamp: 2; font-size: 13px; font-weight: 600; }
.src-snip { -webkit-line-clamp: 2; line-clamp: 2; color: var(--muted-foreground); font-size: 12px; }
.rv-row { scroll-margin-top: 16px; transition: box-shadow .3s; }

.link-url { display: block; padding: 8px 10px; background: var(--muted); border-radius: var(--radius-md); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
.row-srcs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }

.src-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 26px; padding: 0 10px 0 3px; background: var(--background); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; font-weight: 500; }
.src-pill { color: var(--foreground); text-decoration: none; cursor: pointer; }

.src-pill[aria-expanded="true"] .at { background: var(--background); }
.src-ico.media { --c: var(--c4); }
.src-view { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }

.player { display: flex; align-items: center; gap: 10px; }

.src-pill .n { color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

/* History of changes on a submission */
.hist-wrap { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--border); scroll-margin-top: 16px; }

/* Alternative 01: one searchable list of options, the person's own area first */
.my-area { max-width: 720px; }

.pick-add:hover { background: var(--muted); }

/* Start of the form: search, upload, or leave a recording */
.start { display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
.start-searchbox { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); color: var(--muted-foreground); }
.start-searchbox:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }

.start-search:focus { outline: none; }

.start-results .sf-txt { display: flex; flex-direction: column; gap: 2px; }

.start-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.start-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; text-align: left; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); cursor: pointer; }
.start-card:hover:not(:disabled), .start-card.over { background: var(--muted); }
.start-card:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.start-card.over { border-style: dashed; border-color: var(--primary); }

@keyframes upload-arrow { 0% { transform: translateY(0); opacity: 1; animation-timing-function: ease-in; } 40% { transform: translateY(-12px); opacity: 0; animation-timing-function: step-end; } 40.01% { transform: translateY(12px); opacity: 0; animation-timing-function: ease-out; } 80%, 100% { transform: translateY(0); opacity: 1; } }
label.start-card:hover .arrow-group, label.start-card.over .arrow-group { animation: upload-arrow 1s infinite; }
@media (prefers-reduced-motion: reduce) { label.start-card:hover .arrow-group, label.start-card.over .arrow-group { animation: none; } }
.magnifier-group { transform-box: fill-box; transform-origin: 13px 13px; }
@keyframes magnifier { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(1px, -1px) rotate(-5deg); } 50% { transform: translate(0, -2px) rotate(5deg); } 75% { transform: translate(-1px, -1px) rotate(-5deg); } }
.start-searchbox:hover .magnifier-group { animation: magnifier 1s ease-in-out; }
@media (prefers-reduced-motion: reduce) { .start-searchbox:hover .magnifier-group { animation: none; } }
.v2-search { display: flex; flex-direction: column; gap: 8px; }

.v2-opt[aria-pressed="true"] { background: var(--muted); border-color: var(--ring); }

.v2-opt .edit { text-decoration: underline; }
.v2-addrow { display: flex; gap: 8px; }

.v2-or::before, .v2-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.btn .ico { display: inline-flex; margin-right: 6px; }
.v3-mine { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--muted); border: 1px solid var(--ring); border-radius: var(--radius-xl); }
.v3-mine-head { display: flex; flex-direction: column; gap: 2px; }
.v3-mine-cap { color: var(--muted-foreground); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.v3-mine-name { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
#start-add { display: inline-flex; align-items: center; justify-content: center; }
.risk-editor { display: flex; flex-direction: column; gap: 14px; }
.intro-h { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.intro-why { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.intro-card { display: flex; flex-direction: column; gap: 6px; padding: 16px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }

.intro-txt { display: flex; flex-direction: column; gap: 2px; max-width: 60ch; }
.start-own { grid-column: 1 / -1; cursor: default; }

.start-own-row { display: flex; gap: 8px; align-self: stretch; margin-top: 6px; }
.start-own-row .line { flex: 1; min-width: 0; max-width: none; }
.start-card:disabled { opacity: .5; cursor: default; }
.start-title { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }

.ico { display: inline-grid; place-items: center; }

/* Single-screen form: a list of risks, each added through a progressive-disclosure editor */
.risk-list { display: flex; flex-direction: column; gap: 10px; }
.risk-card { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 12px 14px; font-size: 14px; }
.risk-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.risk-actions { display: flex; gap: 16px; margin-top: 2px; }
.risk-actions .edit { text-decoration: underline; }
.risk-empty { margin: 0; border: 1px dashed var(--ring); border-radius: var(--radius); padding: 22px 16px; color: var(--muted-foreground); font-size: 14px; text-align: center; }

.sf { max-width: 720px; gap: 26px; }
.sf-step { display: flex; flex-direction: column; gap: 10px; }
.sf-step.reveal { animation: up .35s cubic-bezier(.2, .7, .2, 1); }
.sf-label { display: flex; align-items: baseline; font-size: 14px; font-weight: 600; }
.sf-clear { margin-left: auto; font-weight: 500; text-decoration: underline; }
.sf-body { display: flex; flex-direction: column; gap: 12px; }
.sf-label .opt-note { margin-left: 8px; color: var(--muted-foreground); font-weight: 400; font-size: 12px; }
.chip.lg { min-height: 36px; padding: 7px 14px; font-size: 14px; }
.sf-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.sf-opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: left; background: var(--background); color: var(--foreground); border: 0; border-bottom: 1px solid var(--border); font-size: 15px; cursor: pointer; }
.sf-opt:last-child { border-bottom: 0; }
.sf-opt:hover { background: var(--muted); }
.sf-opt:focus-visible { outline-offset: -2px; }
.sf-opt .dot { flex: none; width: 16px; height: 16px; border: 1.5px solid var(--ring); border-radius: 50%; }

.sf-opt[aria-pressed="true"] { font-weight: 500; }
.sf-opt[aria-pressed="true"] .dot { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 3px var(--background); }
.sf-opt .chg { color: var(--muted-foreground); font-size: 13px; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
.sf .line { max-width: none; min-height: 150px; padding: 12px 14px; font-size: 16px; line-height: 1.5; }

.sf-own { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.proposal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.rec-mic { display: inline-grid; place-items: center; }
.think { display: flex; flex-direction: column; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.think:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.sf .think .line { min-height: 120px; background: transparent; border: 0; box-shadow: none; resize: vertical; }

.think-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 8px 8px 14px; }
.think-bar .tip { flex: 1; min-width: 0; }
.mic { flex: none; width: 34px; height: 34px; display: grid; place-items: center; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 50%; cursor: pointer; }
.mic:hover:not(:disabled) { background: var(--muted); }

.mic[aria-pressed="true"] .rec-dot { background: var(--background); }

.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--destructive); }

      if (t.id && /__fu$/.test(t.id) && t.value.trim()) { e.preventDefault(); var cq = qById(state.at); if (cq) sendReply(cq); return; }
      e.preventDefault();
      next();
      return;
    }
    if (typing) return;
    var q = qById(state.at);
    if (!q) return;
    var key = e.key.toUpperCase(), hit;
    if (q.type === 'scale') {
      if (/^[1-5]$/.test(key)) { e.preventDefault(); pick(q, key); }
    } else if (q.type === 'yesno' || q.type === 'choice' || q.type === 'multi') {
      hit = opts(q).filter(function (o) { return o.k === key; })[0];
      if (hit) { e.preventDefault(); pick(q, hit.v); }
    }
  });

  function start(data) {
    draftLoad();
    dashTrack('opened');
    if (data && data.answers) state.answers = data.answers;
    if (data && data.fu) state.fu = data.fu;
    if (data && data.edited) state.edited = data.edited;
    if (data && data.editing) state.editing = true;
    if (data && data.mode === 'review') state.mode = data.mode;
    if (data && data.req && data.req.risks) state.req = data.req;
    if (data && data.at) state.at = data.at;
    if (role === 'compliance' && state.mode === 'form' && !state.req) state.mode = 'dash';
    render('fwd');
  }
  var hot = window.claude && window.claude.hot;
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); });
  if (hot && hot.snapshot) hot.snapshot(function () {
    var keep = {}, k;
    for (k in state.answers) if (k !== 'files') keep[k] = state.answers[k];
    return { answers: keep, fu: state.fu, edited: state.edited, editing: state.editing, at: state.at, mode: state.mode, req: state.req };
  });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
