<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Assessment: Free hand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one question per screen in a narrow left-aligned column, centred vertically. Styled with shadcn/ui's zinc tokens and component shapes; light theme only by request. */
:root {
  /* Accent for hover frames, change dots and edited cells; light blue in dark mode. */
  --accent: #093584;
  --accent-soft: rgba(9, 53, 132, .05);
  --background: #ffffff;
  --foreground: #09090b;
  --muted: #f4f4f5;
  --muted-foreground: #71717a;
  --primary: #18181b;
  --primary-foreground: #fafafa;
  --border: #e4e4e7;
  --ring: #a1a1aa;
  --ring-soft: rgba(161, 161, 170, .35);
  --destructive: #dc2626;
  --destructive-border: rgba(220, 38, 38, .45);
  --destructive-tint: #fef2f2;
  --success: #15803d;
  --success-border: rgba(22, 163, 74, .4);
  --success-tint: #f0fdf4;
  --c1: #2563eb; --c2: #b45309; --c3: #047857; --c4: #be185d; --c5: #6d28d9; --c6: #0e7490;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
  --radius: .5rem;
  --radius-md: calc(var(--radius) - 2px);
  --radius-xl: calc(var(--radius) + 4px);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}

/* Dark theme, switched by the button in the top bar (light is the default) */
:root.dark {
  --accent: #e0f0ff;
  --accent-soft: rgba(224, 240, 255, .08);
  --background: #09090b;
  --foreground: #fafafa;
  --muted: #1e1e22;
  --muted-foreground: #a1a1aa;
  --primary: #fafafa;
  --primary-foreground: #18181b;
  --border: #303036;
  --ring: #71717a;
  --ring-soft: rgba(113, 113, 122, .4);
  --destructive: #f87171;
  --destructive-border: rgba(248, 113, 113, .45);
  --destructive-tint: #2a1215;
  --success: #4ade80;
  --success-border: rgba(74, 222, 128, .35);
  --success-tint: #0f2417;
  --c1: #60a5fa; --c2: #fbbf24; --c3: #34d399; --c4: #f472b6; --c5: #a78bfa; --c6: #22d3ee;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

/* The whole page scrolls; no pane has its own scrollbar. */
html { height: 100%; }
body { min-height: 100%; }
body {
  background: var(--background); color: var(--foreground);
  font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* Progress */
.rail { flex: none; height: 8px; margin: 16px 24px 0; border-radius: 999px; background: var(--muted); overflow: hidden; }
.rail > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .4s ease; }

.top { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 24px; }
.top b { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
/* Badge, secondary */
.tag { background: var(--muted); border-radius: var(--radius-md); padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }

main { flex: 1 0 auto; display: flex; padding-inline: 24px; padding-block: 16px; }
.q { --qsize: clamp(20px, 4vw, 24px); margin: auto; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 24px; }
.q.fwd { animation: up .32s cubic-bezier(.2, .7, .2, 1); }
.q.back { animation: down .32s cubic-bezier(.2, .7, .2, 1); }
@keyframes up { from { opacity: 0; transform: translateY(32px); } }
@keyframes down { from { opacity: 0; transform: translateY(-32px); } }
@media (prefers-reduced-motion: reduce) { .q.fwd, .q.back { animation: none; } .rail > i { transition: none; } }

.q.hang { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 20px; }
.q.hang > * { grid-column: 2; justify-self: start; }
.q.hang > .head, .q.hang > .field, .q.hang > .line, .q.hang > .money, .q.hang > .sign, .q.hang > .scale, .q.hang > .opts.wide { justify-self: stretch; }
.q.hang > .num { grid-column: 1; grid-row: 1; }
.head { display: flex; flex-direction: column; gap: 6px; }
.num { font-family: var(--mono); font-size: 13px; line-height: calc(var(--qsize) * 1.3); color: var(--muted-foreground); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
h1 { font-weight: 600; font-size: var(--qsize); line-height: 1.3; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1.big { font-size: clamp(30px, 6.5vw, 41px); font-weight: 700; letter-spacing: -.03em; line-height: 1.12; }
.help { color: var(--muted-foreground); font-size: 15px; margin: 0; max-width: 60ch; }

/* Input, Textarea */
.field { display: flex; flex-direction: column; gap: 8px; }
.line {
  box-sizing: border-box; width: 100%; max-width: 480px; height: 44px; padding: 0 12px;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
textarea.line { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; }
.line::placeholder { color: var(--muted-foreground); }
.line:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.money { display: flex; align-items: center; gap: 8px; }
.money span { color: var(--muted-foreground); font-size: 16px; }
.money .line { max-width: 200px; font-variant-numeric: tabular-nums; }
.tip { font-size: 13px; color: var(--muted-foreground); }
kbd { font-family: var(--mono); font-size: 11px; background: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--foreground); }

/* Options: outline rows with a kbd hint */
.opts { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.opts.wide { align-items: stretch; max-width: 420px; }
.opt {
  display: flex; align-items: center; gap: 10px; min-width: 220px; text-align: left; cursor: pointer;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  padding: 9px 12px 9px 9px; font-size: 15px; font-weight: 500; transition: background .12s, border-color .12s;
}
.opt:hover { background: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: var(--muted); }
.key {
  flex: none; width: 22px; height: 22px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; background: var(--muted); border: 1px solid var(--border); border-radius: 4px;
}
.opt[aria-pressed="true"] .key { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.opt .lbl { flex: 1; min-width: 0; }
.opt .tick { visibility: hidden; font-size: 14px; }
.opt[aria-pressed="true"] .tick { visibility: visible; }

.scale { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.scale .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale .opt { min-width: 0; justify-content: center; padding: 12px 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.scale .ends { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted-foreground); }

/* File upload */
.field.upload { gap: 12px; max-width: 520px; }
.drop {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer;
  background: var(--background); border: 1px dashed var(--ring); border-radius: var(--radius); padding: 28px 16px; font-size: 15px;
  transition: background .12s, border-color .12s;
}
.drop:hover, .drop.over { background: var(--muted); border-color: var(--primary); }
.drop:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.drop b { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.pick { position: absolute; width: 1px; height: 1px; opacity: 0; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.files li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; font-size: 14px; }
.files .kind { font-family: var(--mono); font-size: 10.5px; font-weight: 500; background: var(--muted); border-radius: 4px; padding: 3px 0; text-align: center; }
.files .fname { overflow-wrap: anywhere; font-weight: 500; }
.files .size { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.files .rm { width: 28px; height: 28px; background: none; border: 0; border-radius: var(--radius-md); color: var(--muted-foreground); cursor: pointer; font-size: 17px; line-height: 1; }
.files .rm:hover { background: var(--muted); color: var(--destructive); }

/* Per-step attachments and AI follow-up badge */
.q.over { outline: 2px dashed var(--ring); outline-offset: 12px; border-radius: var(--radius); }
.attach-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.attach-btn {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; cursor: pointer;
  background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); font-size: 13px; font-weight: 500;
}
.attach-btn:hover { background: var(--muted); }
.attach-btn:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag.ai { background: var(--background); border: 1px solid var(--border); font-weight: 500; }
.att-note { display: block; color: var(--muted-foreground); font-weight: 400; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* AI follow-up: a short chat under the answer it relates to */
.follow { gap: 14px; max-width: 560px; border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: 14px 16px; animation: up .3s cubic-bezier(.2, .7, .2, 1); }
.log { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; }
.msg p { margin: 0; min-width: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.ai .who { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); font-size: 11px; }
.msg.ai p { padding-top: 1px; font-weight: 500; }
.msg.ai.end p { font-weight: 400; color: var(--muted-foreground); }
.msg.me { justify-content: flex-end; }
.msg.me p { max-width: 85%; background: var(--muted); border-radius: 18px; padding: 8px 14px; }
.msg p.dots { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding-top: 0; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-foreground); animation: blink 1.2s infinite both; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--background); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow-sm); padding: 5px 5px 5px 14px; }
.composer:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.reply { flex: 1; min-width: 0; max-height: 160px; border: 0; background: transparent; resize: none; padding: 6px 0; font-size: 15px; line-height: 1.4; }
.reply:focus { outline: none; }
.reply::placeholder { color: var(--muted-foreground); }
.send { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); cursor: pointer; font-size: 15px; }
.send:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: reduce) { .follow, .dots i { animation: none; } }

/* Dashboard of submitted forms */
.q.wide { max-width: 760px; }
.flist { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.ftext { flex: 1 1 240px; min-width: 0; }
.frow:last-child { border-bottom: 0; }
.ftitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 500; }
.fsub { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }

/* Risk input: four optional fields per risk */
.risk { gap: 16px; max-width: 560px; }
.risk label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
.risk label > span { display: flex; align-items: baseline; gap: 8px; }
.risk .opt-note { color: var(--muted-foreground); font-weight: 400; font-size: 12px; }
.risk .line { max-width: none; min-height: 64px; font-size: 15px; }

.clipwrap { display: block; }
.clip { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; line-clamp: 5; overflow: hidden; white-space: pre-wrap; }
.clip.open { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
.more { display: block; margin-top: 4px; text-decoration: underline; }

/* View switch (Tabs) and the reviewer split screen */
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--muted); border-radius: var(--radius); }
.tabs button { height: 30px; padding: 0 12px; border: 0; background: transparent; border-radius: var(--radius-md); color: var(--muted-foreground); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
main.rvmode { padding-block: 4px 20px; }
.rv { width: 100%; max-width: 1180px; min-height: 0; margin: 0 auto; display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); border: 1px solid var(--border); border-radius: var(--radius-xl); }
.rv-list { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
.rv-head { display: flex; border-top-left-radius: calc(var(--radius-xl) - 1px); align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; background: var(--background); border-bottom: 1px solid var(--border); }
.rv-pad { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.rv-item { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.rv-item:hover, .rv-item[aria-current="true"] { background: var(--muted); }
.rv-item:disabled { opacity: .5; cursor: default; }
.rv-item:focus-visible { outline-offset: -2px; }
.rv-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
.rv-detail { display: flex; flex-direction: column; gap: 16px; padding: 20px 24px 28px; }
.rv-detail h1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 22px; }
.rv-over { margin: 0; background: var(--muted); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; }
.rv-detail .grp { margin-top: 6px; }
.rv-row { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--border); }
.rv-row h3 { margin: 0; font-size: 14px; font-weight: 600; }
.rv-text { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv-text.none, .rv-sub { color: var(--muted-foreground); }
.rv-sub { margin: 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv-detail .line { max-width: none; min-height: 110px; font-size: 14px; }
.rv-back { display: none; align-self: flex-start; }
@media (max-width: 760px) {
  .rv { grid-template-columns: minmax(0, 1fr); border: 0; border-radius: 0; overflow: visible; }
  .rv-list { border-right: 0; overflow: visible; }
  .rv-detail { display: none; overflow: visible; padding: 4px 0 20px; }
  .rv.show-detail .rv-list { display: none; }
  .rv.show-detail .rv-detail { display: flex; }
  .rv-back { display: block; }
}

/* Regenerate for another area */
.ctx { gap: 6px; max-width: 560px; background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; }
.ctx b { font-size: 13px; }
.rg-list { display: flex; flex-direction: column; gap: 8px; }
.rg-list .check b { display: block; margin-bottom: 2px; }
.rg-list .clip { color: var(--muted-foreground); font-size: 13px; }
.rv-detail .opts.wide { max-width: 420px; }
.rv-detail .risk { max-width: 520px; }
.rv-detail .risk .line { min-height: 72px; }

.top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.theme { width: 36px; height: 36px; display: grid; place-items: center; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); cursor: pointer; }
.theme:hover, .theme[aria-pressed="true"] { background: var(--muted); }

/* Tagging view and tag manager */
.tg { width: 100%; max-width: 1180px; min-height: 0; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.tg > .rv { flex: 1; }
.tg-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.rv.single { grid-template-columns: minmax(0, 1fr); }
.rv-over > p { margin: 0; }
.rv-over > p + p, .rv-over-list + p { margin-top: 8px; }
.rv-over-list { margin: 6px 0 0; padding-left: 20px; }
.rv-over-list li { margin: 2px 0; line-height: 1.5; }
.rv-over-more { margin-top: 4px; font-size: 14px; text-decoration: underline; }
.rv-over b { display: block; font-size: 13px; margin-bottom: 2px; }
.rv-over .tip { display: block; margin-top: 4px; }
.rv-row h3 .opt-note, .grp .opt-note { margin-left: 8px; color: var(--muted-foreground); font-weight: 400; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 30px; padding: 5px 12px; text-align: left; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 15px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chip:hover { background: var(--muted); }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.chip-edit { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 2px 4px 2px 12px; background: var(--background); border: 1px solid var(--border); border-radius: 16px; }
.chip-edit:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.chip-edit input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 4px 0; font-size: 13px; font-weight: 500; }
.chip-edit input:focus { outline: none; }
.chip-edit .n { color: var(--muted-foreground); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip-edit button { flex: none; min-width: 24px; height: 24px; padding: 0 6px; border: 0; border-radius: 12px; background: none; color: var(--muted-foreground); font-size: 15px; line-height: 1; cursor: pointer; }
.chip-edit button:hover { background: var(--muted); color: var(--destructive); }
.chip-edit button.ask { color: var(--destructive); font-size: 12px; font-weight: 500; }
.tg-group { padding-bottom: 14px; }
.tg-add { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rv-detail .tg-add .line { height: 32px; min-height: 0; max-width: 240px; font-size: 13px; }
@media (max-width: 760px) { .rv.single .rv-detail { display: flex; } }

.chip-areas, .tg-parts { display: flex; flex-direction: column; gap: 12px; }
.chip-area, .tg-part { display: flex; flex-direction: column; gap: 6px; }
.chip-area .cap, .tg-part .cap { color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
.tg-part + .tg-part { padding-top: 12px; border-top: 1px solid var(--border); }

/* Labeling screen (after Label Studio): palette, text regions, regions panel */
.c1 { --c: var(--c1); } .c2 { --c: var(--c2); } .c3 { --c: var(--c3); } .c4 { --c: var(--c4); } .c5 { --c: var(--c5); } .c6 { --c: var(--c6); }
.lb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lb-nav { display: flex; align-items: center; gap: 8px; }
.tag.done { background: var(--success-tint); color: var(--success); }
.lb-wrap { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; }
.lb-main { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.lb-side { flex: 1 1 220px; max-width: 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.lb-palette { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.lb-grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lb-grp .cap { width: 100%; color: var(--muted-foreground); font-size: 12px; }
.lbl { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 6px 3px 9px; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
.lbl:hover { background: var(--muted); }
.lbl[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 20%, var(--background)); border-color: var(--c); }
.lb-text { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; font-size: 16px; line-height: 2.1; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; -webkit-user-select: text; user-select: text; }

.lb-mark.sel { outline: 2px solid var(--c); outline-offset: 1px; }
.lb-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lb-regions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lb-regions li { display: flex; align-items: flex-start; gap: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); }
.lb-regions li.sel { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.lb-reg { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; padding: 8px 4px 8px 10px; background: none; border: 0; text-align: left; color: inherit; font-size: 13px; cursor: pointer; }
.lb-reg b, .lb-reg .fsub, .lb-quote { display: block; }
.lb-quote { margin-top: 2px; overflow-wrap: anywhere; }
.lb-dot { flex: none; width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; background: var(--c); }
.lb-regions .rm { flex: none; width: 28px; height: 28px; margin: 4px 4px 0 0; background: none; border: 0; border-radius: var(--radius-md); color: var(--muted-foreground); font-size: 17px; line-height: 1; cursor: pointer; }
.lb-regions .rm:hover { background: var(--muted); color: var(--destructive); }
.st { flex: none; width: 16px; height: 16px; display: inline-grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--border); font-size: 10px; font-weight: 700; line-height: 1; }
.st.submitted { background: var(--success); border-color: var(--success); color: var(--success-tint); }
.st.skipped { background: var(--muted); color: var(--muted-foreground); }

/* Summary sources: citation chips in the text and a list of source cards */
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 3px; padding: 0 5px; vertical-align: 1px; background: var(--border); color: var(--muted-foreground); border: 0; border-radius: 9px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; cursor: pointer; }
.cite:hover { background: var(--primary); color: var(--primary-foreground); }
.srcs { display: flex; flex-direction: column; gap: 10px; }
.src-toggle { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-sm); font-size: 13px; font-weight: 500; cursor: pointer; }
.src-toggle:hover { background: var(--muted); }
.src-toggle .n, .src-top .n { color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.src-stack { display: inline-flex; padding-left: 6px; }
.src-stack .src-ico { margin-left: -6px; box-shadow: 0 0 0 2px var(--background); }
.src-ico { flex: none; min-width: 20px; height: 20px; padding: 0 3px; display: inline-grid; place-items: center; border-radius: 6px; background: color-mix(in srgb, var(--c) 20%, var(--background)); color: var(--c); font-family: var(--mono); font-size: 9px; font-weight: 600; line-height: 1; }
.src-ico.answer { --c: var(--c1); } .src-ico.followup { --c: var(--c5); } .src-ico.file { --c: var(--c3); }
.src-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.src { min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; text-align: left; background: var(--background); color: inherit; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; }
.src:hover { background: var(--muted); }
.src-top { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12px; }
.src-top .src-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-top .n { margin-left: auto; }
.src-title, .src-snip { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.src-title { -webkit-line-clamp: 2; line-clamp: 2; font-size: 13px; font-weight: 600; }
.src-snip { -webkit-line-clamp: 2; line-clamp: 2; color: var(--muted-foreground); font-size: 12px; }
.rv-row { scroll-margin-top: 16px; transition: box-shadow .3s; }
.rv-row.flash { box-shadow: 0 0 0 2px var(--ring); border-radius: var(--radius-md); }

.link-url { display: block; padding: 8px 10px; background: var(--muted); border-radius: var(--radius-md); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
.row-srcs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.row-srcs .cap { margin-right: 2px; color: var(--muted-foreground); font-size: 12px; }
.src-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 26px; padding: 0 10px 0 6px; background: var(--background); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; font-weight: 500; }
.src-pill { color: var(--foreground); text-decoration: none; cursor: pointer; }
.src-pill:hover, .src-pill[aria-expanded="true"] { background: var(--muted); }
.src-pill:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.src-pill .at { font-family: var(--mono); font-size: 11px; background: var(--muted); border-radius: 4px; padding: 1px 5px; }
.src-pill[aria-expanded="true"] .at { background: var(--background); }
.src-ico.media { --c: var(--c4); }
.src-icon { flex: none; display: inline-flex; color: var(--muted-foreground); }
.src-pill:hover .src-icon, .src-pill[aria-expanded="true"] .src-icon { color: var(--foreground); }
.src-view { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.src-view .tip, .src-view .rv-text, .src-view .quote { margin: 0; }
.src-view .quote { font-size: 15px; font-style: italic; }
.player { display: flex; align-items: center; gap: 10px; }
.player .play { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); font-size: 11px; padding-left: 2px; }
.player .time { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.player .track { flex: 1; height: 6px; background: var(--muted); border-radius: 3px; overflow: hidden; }
.player .track i { display: block; height: 100%; background: var(--c4); border-radius: 3px; }
.src-pill .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-pill .n { color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

/* History of changes on a submission */
.hist-wrap { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--border); scroll-margin-top: 16px; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist li { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding-bottom: 18px; }
.hist li::before { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 1px; background: var(--border); }
.hist li:last-child { padding-bottom: 0; }

.hist-dot { width: 9px; height: 9px; margin: 6px 0 0 3px; border-radius: 50%; background: var(--muted-foreground); }

.hist-title { margin: 0; font-size: 14px; font-weight: 500; }
.diff { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 8px; }
.diff > div { min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; font-size: 13px; }
.diff .was { color: var(--muted-foreground); }
.diff .cap { display: block; margin-bottom: 2px; color: var(--muted-foreground); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

/* Summary of the risks added so far, as a table that scrolls sideways on its own when the screen is narrow */
.sf.has-table { max-width: 1560px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.risk-table { width: 100%; min-width: 980px; border-collapse: collapse; font-size: 14px; }
.risk-table th { padding: 10px 12px; text-align: left; white-space: nowrap; background: var(--muted); color: var(--muted-foreground); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; }
.risk-table td { padding: 12px; vertical-align: top; border-bottom: 1px solid var(--border); }

.cell-list { display: flex; flex-direction: column; gap: 6px; }

.src-cell .ans { display: block; color: var(--muted-foreground); }
.row-actions { white-space: nowrap; }
.row-actions .edit { margin-right: 12px; text-decoration: underline; }
.row-actions .edit:last-child { margin-right: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Alternative 01: one searchable list of options, the person's own area first */
.my-area { max-width: 720px; }
.pick-label { margin-top: 4px; color: var(--muted-foreground); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.pick-group { display: flex; flex-direction: column; gap: 6px; }
.pick-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 2px; background: none; color: var(--foreground); border: 0; font-size: 14px; font-weight: 600; text-align: left; }
button.pick-head { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; }
button.pick-head:hover { background: var(--muted); }
.pick-head > span:first-child { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }

.pick-head[aria-expanded="true"] .combo-chev .up { display: block; }
.sf-opt.sub { padding-left: 42px; }
.sf-opt .syn { flex: none; color: var(--muted-foreground); font-size: 12px; }
.chips.picked .chip { cursor: pointer; }
.pick-add { align-self: flex-start; padding: 8px 12px; background: var(--background); color: var(--foreground); border: 1px dashed var(--ring); border-radius: var(--radius-md); font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; }
.pick-add:hover { background: var(--muted); }

/* Start of the form: search, upload, or leave a recording */
.start { display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
.start-searchbox { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); color: var(--muted-foreground); }
.start-searchbox:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.start-search { flex: 1; min-width: 0; height: 52px; background: transparent; color: var(--foreground); border: 0; font-size: 16px; }
.start-search:focus { outline: none; }
.start-search::placeholder { color: var(--muted-foreground); }
.start-results .sf-txt { display: flex; flex-direction: column; gap: 2px; }
.start-none { margin: 0; padding: 10px 14px; }
.start-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.start-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; text-align: left; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); cursor: pointer; }
.start-card:hover:not(:disabled), .start-card.over { background: var(--muted); }
.start-card:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.start-card.over { border-style: dashed; border-color: var(--primary); }
.start-card.on { border-color: var(--destructive); }
.start-card .ico svg { overflow: visible; }
@keyframes upload-arrow { 0% { transform: translateY(0); opacity: 1; animation-timing-function: ease-in; } 40% { transform: translateY(-12px); opacity: 0; animation-timing-function: step-end; } 40.01% { transform: translateY(12px); opacity: 0; animation-timing-function: ease-out; } 80%, 100% { transform: translateY(0); opacity: 1; } }
label.start-card:hover .arrow-group, label.start-card.over .arrow-group { animation: upload-arrow 1s infinite; }
@media (prefers-reduced-motion: reduce) { label.start-card:hover .arrow-group, label.start-card.over .arrow-group { animation: none; } }
.magnifier-group { transform-box: fill-box; transform-origin: 13px 13px; }
@keyframes magnifier { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(1px, -1px) rotate(-5deg); } 50% { transform: translate(0, -2px) rotate(5deg); } 75% { transform: translate(-1px, -1px) rotate(-5deg); } }
.start-searchbox:hover .magnifier-group { animation: magnifier 1s ease-in-out; }
@media (prefers-reduced-motion: reduce) { .start-searchbox:hover .magnifier-group { animation: none; } }
.v2-search { display: flex; flex-direction: column; gap: 8px; }
.v2-searchrow { display: flex; align-items: stretch; gap: 8px; }
.v2-searchrow .start-searchbox { flex: 1; min-width: 0; }
.v2-searchrow .btn { height: auto; }
.v2-list { display: flex; flex-direction: column; gap: 12px; }
.v2-rows { display: flex; flex-direction: column; gap: 8px; }
.v2-opt { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 11px 14px; text-align: left; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); font-size: 14px; font-weight: 500; }
button.v2-opt { cursor: pointer; }
button.v2-opt:hover { background: var(--muted); }
.v2-opt .dot { flex: none; width: 16px; height: 16px; border: 1.5px solid var(--ring); border-radius: 50%; }
.v2-opt .sf-txt { flex: 1; min-width: 0; }
.v2-opt[aria-pressed="true"] { background: var(--muted); border-color: var(--ring); }
.v2-opt[aria-pressed="true"] .dot { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 3px var(--muted); }
.v2-opt .edit { text-decoration: underline; }
.v2-addrow { display: flex; gap: 8px; }
.v2-addrow .line { flex: 1; min-width: 0; }
.v2-or { display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 500; }
.v2-or::before, .v2-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.btn .ico { display: inline-flex; margin-right: 6px; }
.v3-mine { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--muted); border: 1px solid var(--ring); border-radius: var(--radius-xl); }
.v3-mine-head { display: flex; flex-direction: column; gap: 2px; }
.v3-mine-cap { color: var(--muted-foreground); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.v3-mine-name { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
#start-add { display: inline-flex; align-items: center; justify-content: center; }
.risk-editor { display: flex; flex-direction: column; gap: 14px; }
.intro-h { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.intro-why { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.intro-card { display: flex; flex-direction: column; gap: 6px; padding: 16px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.intro-title { font-size: 15px; font-weight: 600; }
.intro-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }

.intro-n { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; background: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 500; }
.intro-txt { display: flex; flex-direction: column; gap: 2px; max-width: 60ch; }
.start-own { grid-column: 1 / -1; cursor: default; }
.start-own:hover:not(:disabled) { background: var(--background); }
.start-own:focus-within { outline: none; }
.start-own-row { display: flex; gap: 8px; align-self: stretch; margin-top: 6px; }
.start-own-row .line { flex: 1; min-width: 0; max-width: none; }
.start-card:disabled { opacity: .5; cursor: default; }
.start-title { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.start-title .at { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.ico { display: inline-grid; place-items: center; }

/* Single-screen form: a list of risks, each added through a progressive-disclosure editor */
.risk-list { display: flex; flex-direction: column; gap: 10px; }
.risk-card { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 12px 14px; font-size: 14px; }
.risk-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.risk-actions { display: flex; gap: 16px; margin-top: 2px; }
.risk-actions .edit { text-decoration: underline; }
.risk-empty { margin: 0; border: 1px dashed var(--ring); border-radius: var(--radius); padding: 22px 16px; color: var(--muted-foreground); font-size: 14px; text-align: center; }
.risk-editor { display: flex; flex-direction: column; gap: 22px; }
.sf { max-width: 720px; gap: 26px; }
.sf-step { display: flex; flex-direction: column; gap: 10px; }
.sf-step.reveal { animation: up .35s cubic-bezier(.2, .7, .2, 1); }
.sf-label { display: flex; align-items: baseline; font-size: 14px; font-weight: 600; }
.sf-clear { margin-left: auto; font-weight: 500; text-decoration: underline; }
.sf-body { display: flex; flex-direction: column; gap: 12px; }
.sf-label .opt-note { margin-left: 8px; color: var(--muted-foreground); font-weight: 400; font-size: 12px; }
.chip.lg { min-height: 36px; padding: 7px 14px; font-size: 14px; }
.sf-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.sf-opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: left; background: var(--background); color: var(--foreground); border: 0; border-bottom: 1px solid var(--border); font-size: 15px; cursor: pointer; }
.sf-opt:last-child { border-bottom: 0; }
.sf-opt:hover { background: var(--muted); }
.sf-opt:focus-visible { outline-offset: -2px; }
.sf-opt .dot { flex: none; width: 16px; height: 16px; border: 1.5px solid var(--ring); border-radius: 50%; }
.sf-opt .sf-txt { flex: 1; min-width: 0; }
.sf-opt[aria-pressed="true"] { font-weight: 500; }
.sf-opt[aria-pressed="true"] .dot { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 3px var(--background); }
.sf-opt .chg { color: var(--muted-foreground); font-size: 13px; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
.sf .line { max-width: none; min-height: 150px; padding: 12px 14px; font-size: 16px; line-height: 1.5; }
.sf input.line { height: 44px; min-height: 0; padding: 0 12px; font-size: 15px; }
.sf-own { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sf-own .line { flex: 1 1 260px; }
.proposal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.rec-mic { display: inline-grid; place-items: center; }
.think { display: flex; flex-direction: column; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.think:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-soft); }
.sf .think .line { min-height: 120px; background: transparent; border: 0; box-shadow: none; resize: vertical; }
.sf .think .line:focus { box-shadow: none; }
.think-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 16px 16px 14px; }
.think-bar .tip { flex: 1; min-width: 0; }
.mic { flex: none; width: 34px; height: 34px; display: grid; place-items: center; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 50%; cursor: pointer; }

/* Side menu: sections of the app, collapsible to an icon rail. On small screens it opens over the page. */

.side { position: fixed; z-index: 24; top: 0; left: 0; bottom: 0; width: var(--side-w); box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 62px 10px 16px; background: var(--background); border-right: 1px solid var(--border); overflow: hidden auto; }

.mail-tag button { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; background: transparent; color: var(--muted-foreground); border: 0; border-radius: 50%; cursor: pointer; }
.mail-tag button:hover { background: var(--border); color: var(--foreground); }
.mail-tag.bad { background: var(--destructive-tint); border-color: var(--destructive-border); color: var(--destructive); }
.dash-pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.dash-pages { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.dash-pn { min-width: 32px; padding: 0 8px; }
.dash-pn[aria-current="page"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.dash-top .btn { flex: none; }
.dash-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.dash-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; align-items: stretch; }
.dash-seeall { font-size: 14px; text-decoration: underline; }
.dash-sum { margin: 0; font-size: 14px; line-height: 1.5; }
.dash-news-t { font-weight: 500; }
.dash-news-s { margin: 2px 0 4px; color: var(--foreground); font-size: 13px; line-height: 1.45; }
.dash-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.dash-list li { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.dash-list li:last-child { border-bottom: 0; }
.dash-list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dash-list .edit { text-decoration: underline; white-space: nowrap; }
.dash-dot { flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--c1); }
.dash-dot.read { background: var(--border); }
#dash-mxv .grp { display: flex; align-items: center; gap: 10px; }
.dash-mxv-text { display: flex; flex-direction: column; gap: 8px; max-height: 7.5em; overflow: hidden; font-size: 14px; line-height: 1.5; position: relative; }
.dash-mxv-text:not(.open):not(.fits)::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2em; background: linear-gradient(transparent, var(--background)); }
.dash-mxv-text.open { max-height: none; }
.dash-mxv-text p { margin: 0; }
.dash-mxv-text b { display: block; font-weight: 600; }
.dash-chg { display: block; color: var(--muted-foreground); }
.dash-chg-col { color: var(--foreground); }
.dash-chg-col::after { content: ': '; }
.dash-chg-from { text-decoration: line-through; }
.dash-more-link { align-self: flex-start; margin-top: 6px; text-decoration: underline; text-underline-offset: 3px; }
#dash-subs-open, #dash-mx-open { text-decoration: underline; text-underline-offset: 3px; }
.dash-mxv-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; font-size: 14px; }
.dash-add { display: flex; gap: 8px; }
.dash-add .line { flex: 1; min-width: 0; }
.dash-check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.dash-check input { accent-color: var(--primary); }
/* View switch: the employee sees only the form; the compliance team gets the side menu with its tools. */
.role-switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--muted); border-radius: var(--radius); }
.role-switch button { height: 30px; padding: 0 12px; background: transparent; color: var(--muted-foreground); border: 0; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.role-switch button[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
:root.role-employee, :root.role-employee.side-collapsed { --side-w: 0px; }
:root.role-employee .side, :root.role-employee .side-toggle { display: none; }
/* The menu of form versions only matters to someone filling in the form. */
:root.role-compliance #ver, :root.role-compliance .top-left > b { display: none; }
:root.role-compliance #tab-form, :root.role-compliance .side .side-cap:first-child { display: none; }
@media (max-width: 760px) { :root.role-employee .top { padding-left: 24px; } }
/* The compliance screens use the full width next to the side menu. */
.rv, .tg { max-width: none; margin: 0; }

/* Checkboxes: 16 x 16, an empty box with a border when unchecked, filled with a tick when checked. */
input[type="checkbox"] { -webkit-appearance: none; appearance: none; flex: none; display: inline-grid; place-content: center; width: 16px; height: 16px; margin: 0; padding: 0; background: var(--background); border: 1.5px solid var(--ring); border-radius: 4px; cursor: pointer; vertical-align: middle; }
input[type="checkbox"]::before { content: ''; width: 10px; height: 10px; transform: scale(0); background: var(--primary-foreground); clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); transition: transform .1s; }
input[type="checkbox"]:checked, input[type="checkbox"]:indeterminate { background: var(--primary); border-color: var(--primary); }
input[type="checkbox"]:checked::before { transform: scale(1); }
input[type="checkbox"]:indeterminate::before { transform: scale(1); height: 2px; width: 8px; clip-path: none; border-radius: 2px; }
input[type="checkbox"]:hover:not(:checked):not(:indeterminate) { border-color: var(--foreground); }
input[type="checkbox"]:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
input[type="checkbox"]:disabled { opacity: .5; cursor: default; }

/* Selected text: black highlight with white text (inverted in dark mode). */
::selection { background: var(--primary); color: var(--primary-foreground); }
</style>

h segmentach i opiniowanie programów rabatowych przez Dział Prawny.","Dyrektor Prawny","Dział Prawny, analityk rynku, dane IQVIA, kancelaria zewnętrzna","% programów rabatowych w segmentach o udziale >40% zaopiniowanych prawnie (cel: 100%); liczba postępowań UOKiK (cel: 0)","05.10.2026"],["Current Regulations & Ethical standards","Competition and Consumer Protection","Sharing confidential data","Ryzyko wymiany informacji wrażliwych handlowo (ceny, rabaty, plany wprowadzenia generyków) z konkurentami podczas spotkań stowarzyszeń branżowych lub nieformalnych kontaktów przedstawicieli handlowych. Czynnikiem ryzyka jest częsty udział pracowników w gremiach branżowych bez obecności prawnika.","Ustawa o ochronie konkurencji i konsumentów, art. 101 TFUE; spotkania w ramach izb branżowych","Ugruntowanie wizerunku firmy jako rzetelnego partnera w pracach organizacji branżowych.","Średnioterminowe","Konkurenci w sektorze, Organizacje biznesowe i branżowe, Organy regulacyjne i urzędnicy publiczni","Dział Prawny / Compliance","Kara nałożona przez Prezesa UOKiK do 10% obrotu (art. 106 uokik) oraz odpowiedzialność osobista menedżerów do 2 mln zł.","5","2","10","Średnie","Ograniczanie","Procedura udziału w spotkaniach branżowych z agendą zatwierdzaną przez Dział Prawny i protokołem; szkolenia z prawa konkurencji dla działów sprzedaży. Planowane: e-learning z kartą „do's and don'ts”.","Dyrektor Działu Prawnego","Prawnik ds. konkurencji (0,5 etatu), platforma e-learningowa, rejestr spotkań branżowych","% spotkań branżowych z zatwierdzoną agendą i protokołem (cel: 100%); % pracowników sprzedaży przeszkolonych z prawa konkurencji (cel: 95%)","14.04.2026"],["Current Regulations & Ethical standards","Competition and Consumer Protection","Employment-related anti-competitive practices","Ryzyko zawierania z innymi producentami farmaceutycznymi porozumień o niepodbieraniu pracowników (no-poach) lub ustalania wynagrodzeń, np. dla przedstawicieli medycznych i specjalistów QA. Czynnikiem jest el: 98%); średni czas zapłaty (cel: ≤ 60 dni)","03.03.2026"],["Current Regulations & Ethical standards","Greenwashing","Use of misleading, unsubstantiated, or non‑compliant environmental claims","Ryzyko stosowania na opakowaniach produktów OTC i suplementów oraz w raporcie ESG ogólnikowych twierdzeń typu „eko” lub „neutralny klimatycznie” bez udokumentowanych danych. Czynnikiem jest presja marketingowa i nowe wymogi dyrektywy ECGT.","Dyrektywa (UE) 2024/825 (ECGT), ustawa o przeciwdziałaniu nieuczciwym praktykom rynkowym; dział marketingu","Wiarygodna komunikacja działań środowiskowych może wzmocnić markę i ocenę ESG u inwestorów.","Średnioterminowe","Pacjenci i konsumenci, Organy regulacyjne i urzędnicy publiczni, Organizacje społeczne i pacjenckie, Instytucje finansowe","Marketing / Zrównoważony rozwój","Kara UOKiK za naruszenie zbiorowych interesów konsumentów do 10% obrotu oraz utrata zaufania konsumentów i inwestorów.","3","3","9","Średnie","Ograniczanie","Weryfikacja deklaracji środowiskowych przez Dział Prawny i Zespół ESG przed publikacją; rejestr dowodów (LCA, certyfikaty). Planowane: polityka komunikacji środowiskowej.","Dyrektor ds. Zrównoważonego Rozwoju","Zespół ESG, Dział Prawny, budżet na zewnętrzną weryfikację danych","% twierdzeń środowiskowych z udokumentowanym uzasadnieniem (cel: 100%); liczba skarg dotyczących greenwashingu (cel: 0)","17.06.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Corruption in administrative or regulatory processes","Ryzyko oferowania korzyści urzędnikom URPL, GIF lub WIF w celu przyspieszenia rejestracji produktu, zmian porejestracyjnych lub pozytywnego wyniku inspekcji GMP. Czynnikiem jest presja czasowa przy wprowadzaniu nowych produktów na rynek.","Kodeks karny (art. 229), ustawa Prawo farmaceutyczne; kontakty z URPL i GIF","Przejrzyste relacje z regulatorami sprzyjają przewidywalności procesów rejestracyjnych.","Długoterminowe","Organy regulacyjne i urzędnicy publiczni, Pracownicy, Pacjenci i konsumenci","Dział Rejestracji / Compliance","Odpowiedzialność karna pracowników (do 12 lat pozbawienia wolności), odpowiedzialność podmiotu zbiorowego oraz cofnięcie pozwoleń.","5","1","5","Niskie","Akceptacja","Polityka antykorupcyjna z zakazem płatności przyspieszających; rejestr kontaktów z urzędnikami prowadzony przez Dział Rejestracji.","Kierownik ds. Compliance","Kierownik ds. Compliance, rejestr kontaktów z urzędnikami, kanał zgłoszeń sygnalistów","% kontaktów z urzędnikami odnotowanych w rejestrze (cel: 100%); % pracowników rejestracji przeszkolonych antykorupcyjnie (cel: 100%)","09.07.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Bribery of HCPs for non-medicinal products promotion","Ryzyko przekazywania lekarzom i farmaceutom korzyści (wyjazdy, sprzęt, honoraria) w zamian za rekomendowanie suplementów diety, dermokosmetyków lub wyrobów medycznych, które nie podlegają ograniczeniom Prawa farmaceutycznego w tym samym zakresie co leki.","Kodeks karny (art. 229, 296a), Kodeks Przejrzystości INFARMA; promocja produktów niebędących lekami","Spójne standardy dla wszystkich kategorii produktów wzmacniają wiarygodność wobec środowiska medycznego.","Średnioterminowe","Pracownicy ochrony zdrowia, Pacjenci i konsumenci, Organy regulacyjne i urzędnicy publiczni","Marketing / Compliance","Odpowiedzialność karna, sankcje z ustawy o odpowiedzialności podmiotów zbiorowych oraz poważna szkoda wizerunkowa.","4","3","12","Średnie","Ograniczanie","Rozszerzenie polityki interakcji z HCP na wszystkie kategorie produktów; zatwierdzanie budżetów promocyjnych w systemie z udziałem Compliance. Planowane: audyt wydatków na promocję suplementów.","Dyrektor Marketingu","Zespół Compliance, system zatwierdzania materiałów i wydatków, audyt wewnętrzny","% wydatków na HCP dla produktów niebędących lekami zatwierdzonych przez Compliance (cel: 100%); liczba niezgodności w audycie (cel: 0)","28.08.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Improper customary gifts in business relationships","Ryzyko wręczania lub przyjmowania upominków o nadmiernej wartości w związku ze świętami i jubileuszami, np. przez pracowników zakupów lub działu sprzedaży hurtowej. Czynnikiem jest utrwalony zwyczaj wymiany prezentów w relacjach z hurtowniami.","Kodeks karny (art. 296a), Polityka upominków i gościnności; zwyczaje branżowe","N/D","Krótkoterminowe","Pracownicy, Dostawcy, Dystrybutorzy","Compliance","Ryzyko zarzutu korupcji w sektorze prywatnym i naruszenia Kodeksu postępowania, z konsekwencjami dyscyplinarnymi.","2","3","6","Niskie","Akceptacja","Polityka upominków z limitem wartości 200 zł i obowiązkiem rejestracji; przypomnienia przed okresem świątecznym.","Kierownik ds. Compliance","Rejestr upominków w intranecie, komunikacja wewnętrzna","% upominków powyżej limitu zgłoszonych w rejestrze (cel: 100%); liczba naruszeń polityki upominków (cel: ≤ 2 rocznie)","10.03.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Improper use of donations to influence external stakeholders","Ryzyko przekazywania darowizn szpitalom, fundacjom lub samorządom w celu uzyskania przychylności przy decyzjach refundacyjnych, przetargowych lub lokalizacyjnych. Czynnikiem jest brak jednolitych kryteriów wyboru beneficjentów.","Kodeks karny, Kodeks Przejrzystości INFARMA; proces przyznawania darowizn","Strategiczny program darowizn zwiększa zaufanie społeczności lokalnych i organizacji pacjenckich.","Średnioterminowe","Organizacje społeczne i pacjenckie, Społeczności lokalne, Organy regulacyjne i urzędnicy publiczni","Compliance / Komunikacja Korporacyjna","Zarzut korupcji, sankcje karne i obowiązek publicznego ujawnienia nieprawidłowości, utrata zaufania interesariuszy.","4","2","8","Średnie","Ograniczanie","Komitet darowizn z udziałem Compliance; due diligence beneficjenta i publikacja darowizn w raporcie przejrzystości.","Dyrektor Komunikacji Korporacyjnej","Komitet darowizn, narzędzie due diligence, budżet programu społecznego","% darowizn poprzedzonych due diligence (cel: 100%); % darowizn opublikowanych w raporcie przejrzystości (cel: 100%)","05.05.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Corruption in purchasing (including supplier selection)","Ryzyko przyjmowania łapówek lub prowizji przez pracowników zakupów przy wyborze dostawców substancji czynnych, opakowań i usług inwestycyjnych. Czynnikami są wysoka wartość kontraktów i ograniczona liczba kwalifikowanych dostawców GMP.","Kodeks karny (art. 296a), proces zakupowy i kwalifikacji dostawców","Przejrzysty proces zakupowy obniża koszty i poprawia jakość dostaw.","Średnioterminowe","Dostawcy, Pracownicy, Konkurenci w sektorze","Zakupy / Compliance","Straty finansowe, odpowiedzialność karna pracowników oraz ryzyko jakościowe produktu przy wyborze niewłaściwego dostawcy.","4","3","12","Średnie","Ograniczanie","Zasada czterech oczu i komisje przetargowe przy zakupach powyżej 100 tys. zł; deklaracje konfliktu interesów i rotacja kupców. Planowane: analityka danych zakupowych pod kątem red flags.","Dyrektor Zakupów","Zespół zakupów, platforma e-zakupowa, audyt wewnętrzny, narzędzie analityczne","% zakupów powyżej progu realizowanych w trybie konkurencyjnym (cel: 95%); % kupców z aktualną deklaracją konfliktu interesów (cel: 100%)","19.08.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Circumventing regulations via external vendors","Ryzyko wykorzystania agencji marketingowych, konsultantów lub organizatorów konferencji do przekazywania nienależnych korzyści HCP lub urzędnikom z pominięciem wewnętrznych kontroli. Czynnikiem jest niewystarczający nadzór nad rozliczeniami podwykonawców.","Zewnętrzni dostawcy i pośrednicy; Kodeks karny, ustawa o odpowiedzialności podmiotów zbiorowych","Weryfikacja partnerów podnosi standardy całego łańcucha dostaw usług.","Średnioterminowe","Dostawcy, Pracownicy ochrony zdrowia, Organy regulacyjne i urzędnicy publiczni","Compliance / Zakupy","Odpowiedzialność podmiotu zbiorowego za czyny pośredników, kara do 5 mln zł i zakaz udziału w przetargach.","4","3","12","Średnie","Ograniczanie","Third-party due diligence dla pośredników wysokiego ryzyka; klauzule antykorupcyjne i prawo audytu w umowach.","Kierownik ds. Compliance","Narzędzie TPDD, Dział Prawny, budżet na audyty dostawców","% pośredników wysokiego ryzyka po due diligence (cel: 100%); liczba audytów dostawców rocznie (cel: ≥ 6)","30.09.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Improper influence on public tenders","Ryzyko nieuprawnionego wpływu na treść SIWZ lub wynik przetargów szpitalnych, np. przez kontakty z członkami komisji przetargowych lub zmowę z innymi oferentami. Czynnikiem jest duży udział sprzedaży szpitalnej w przychodach.","Ustawa Prawo zamówień publicznych, Kodeks karny (art. 305); przetargi szpitalne","Uczciwy udział w przetargach umacnia pozycję wiarygodnego dostawcy dla szpitali.","Średnioterminowe","Klienci i odbiorcy, Konkurenci w sektorze, Organy regulacyjne i urzędnicy publiczni","Sprzedaż Szpitalna / Compliance","Wykluczenie z postępowań na podstawie Pzp, odpowiedzialność karna za zmowę przetargową i kary UOKiK.","5","2","10","Średnie","Ograniczanie","Procedura udziału w przetargach z zakazem kontaktów z komisją w trakcie postępowania; przegląd ofert przez Dział Prawny.","Dyrektor Sprzedaży Szpitalnej","Zespół przetargowy, Dział Prawny, rejestr postępowań przetargowych","% ofert przetargowych przejrzanych przez Dział Prawny (cel: 100%); % zespołu przetargowego przeszkolonego (cel: 100%)","11.06.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Recruiting public officials","Ryzyko zatrudnienia lub zawarcia umowy doradczej z byłym urzędnikiem Ministerstwa Zdrowia, URPL lub NFZ, który wcześniej podejmował decyzje dotyczące spółki. Czynnikiem jest zapotrzebowanie na ekspertów ds. refundacji i rejestracji.", etermination","Ryzyko przyznawania premii na podstawie nieobiektywnych kryteriów lub w zamian za korzyści, a także uzależnienia premii przedstawicieli od wolumenu recept. Czynnikiem są uznaniowe elementy systemu premiowego.","Regulamin wynagradzania; Kodeks Przejrzystości INFARMA, proces ustalania celów sprzedażowych","Przejrzysty system premiowy wspiera etyczne zachowania sprzedażowe.","Krótkoterminowe","Pracownicy, Pracownicy ochrony zdrowia, Organy regulacyjne i urzędnicy publiczni","HR / Finanse","Roszczenia pracowników, ryzyko zachęcania do nieetycznej promocji i naruszenia Kodeksu Przejrzystości.","3","3","9","Średnie","Ograniczanie","Zatwierdzanie premii przez przełożonego wyższego szczebla i HR; ograniczenie wagi celów wolumenowych w premii przedstawicieli. Planowane: wskaźnik compliance w kartach celów.","Dyrektor HR","Zespół wynagrodzeń, Kontroling, system HR","% premii zatwierdzonych zgodnie z procedurą (cel: 100%); udział celów jakościowych/compliance w premii przedstawicieli (cel: ≥ 20%)","15.09.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Informal contacts with opionion leaders","Ryzyko nieudokumentowanych spotkań, kolacji lub zleceń dla kluczowych liderów opinii (KOL) poza formalnymi umowami, co może stanowić ukrytą korzyść w zamian za rekomendacje. Czynnikiem są długotrwałe osobiste relacje działu medycznego z ekspertami.","Ustawa Prawo farmaceutyczne (art. 58), Kodeks Przejrzystości INFARMA; relacje z KOL","Sformalizowana współpraca z ekspertami podnosi jakość merytoryczną projektów naukowych.","Średnioterminowe","Pracownicy ochrony zdrowia, Organizacje społeczne i pacjenckie, Organy regulacyjne i urzędnicy publiczni","Dział Medyczny","Kary finansowe GIF do 2 mln zł za niedozwoloną reklamę oraz utrata wiarygodności naukowej.","4","2","8","Średnie","Ograniczanie","Obowiązek rejestrowania interakcji z KOL w CRM; umowy z uzasadnieniem potrzeby i stawek godzinowych zgodnych z FMV.","Dyrektor Medyczny","System CRM (Veeva), siatka stawek FMV, Zespół Compliance","% interakcji z KOL zarejestrowanych w CRM (cel: 100%); % umów z KOL z dokumentacją FMV (cel: 100%)","08.10.2026"],["Current Regulations & Ethical standards","Anti‑Corruption and Bribery","Sponsoring training courses for HCPs","Ryzyko, że finansowanie udziału lekarzy w szkoleniach i kongresach wykroczy poza cele naukowe (np. koszty osób towarzyszących, atrakcje turystyczne) lub będzie uzależnione od wolumenu przepisywania. Czynnikiem jest duża liczba sponsorowanych wydarzeń.","Ustawa Prawo farmaceutyczne (art. 52 i 58), Kodeks Przejrzystości INFARMA; organizatorzy konferencji","Wspieranie rzetelnej edukacji medycznej buduje pozycję firmy jako partnera środowiska lekarskiego.","Krótkoterminowe","Pracownicy ochrony zdrowia, Organizacje biznesowe i branżowe, Organy regulacyjne i urzędnicy publiczni, Pacjenci i konsumenci","Dział Medyczny / Compliance","Kary GIF do 2 mln zł, odpowiedzialność karna i ujawnienie nieprawidłowości w raporcie przejrzystości.","4","4","16","Wysokie","Ograniczanie","Kryteria wyboru uczestników niezależne od sprzedaży; weryfikacja programu i lokalizacji wydarzeń przez Compliance oraz publikacja świadczeń zgodnie z Kodeksem Przejrzystości.","Kierownik ds. Compliance","Zespół Compliance, system zatwierdzania sponsoringu, budżet edukacji medycznej","% sponsoringów zatwierdzonych przez Compliance przed wydarzeniem (cel: 100%); % świadczeń opublikowanych w raporcie przejrzystości (cel: 100%)","26.09.2026"],["Current Regulations & Ethical standards","AML & Financial Integrity","Gaps in AML process","Niepełna weryfikacja beneficjentów rzeczywistych kontrahentów (zwłaszcza dystrybutorów eksportowych i nowych odbiorców hurtowych) oraz brak monitorowania nietypowych transakcji może prowadzić do wykorzystania spółki w procederze prania pieniędzy. Czynnikami ryzyka są transakcje z podmiotami z jurysdykcji podwyższonego ryzyka i płatności od stron trzecich.","Ustawa o przeciwdziałaniu praniu pieniędzy i finansowaniu terroryzmu; sankcje UE","Wiarygodność wobec banków i partnerów handlowych oraz szybszy onboarding zweryfikowanych kontrahentów.","Średnioterminowe","Dystrybutorzy, Instytucje finansowe, Organy regulacyjne i urzędnicy publiczni","Finanse / Compliance","Ryzyko kar administracyjnych i odpowiedzialności karnej (art. 299 k.k.), zablokowania rachunków przez banki oraz poważnej szkody reputacyjnej.","4","2","8","Średnie","Ograniczanie","Weryfikacja KYC kontrahentów i screening list sankcyjnych przy zakładaniu kartoteki w SAP; planowane: automatyczny monitoring nietypowych płatności i płatności od stron trzecich.","Kierownik ds. Compliance","Analityk compliance (1 etat), narzędzie do screeningu sankcyjnego, moduł SAP FI, budżet na dostęp do baz KRS/CRBR","% nowych kontrahentów zweryfikowanych KYC przed pierwszą transakcją (cel: 100%); liczba niewyjaśnionych alertów starszych niż 30 dni (cel: 0)","14.04.2026"],["Current Regulations & Ethical standards","AML & Financial Integrity","Fraud and payment control failures","Słabości w kontroli płatności, takie jak brak zasady dwóch podpisów, niezweryfikowane zmiany numerów rachunków dostawców czy ataki typu CEO fraud, mogą skutkować nieuprawnionymi przelewami. Ryzyko rośnie przy dużym wolumenie faktur i pracy zdalnej działu płatności.","Proces zakupowo-płatniczy (P2P); cyberprzestępcy i nieuczciwi dostawcy","Usprawnienie i automatyzacja procesu P2P ograniczająca koszty i błędy.","Krótkoterminowe","Pracownicy, Dostawcy, Instytucje finansowe","Finanse / Compliance","Bezpośrednie straty finansowe, konieczność korekt sprawozdawczych oraz utrata zaufania banków i audytora.","4","3","12","Średnie","Ograniczanie","Zasada czterech oczu przy zatwierdzaniu przelewów, telefoniczna weryfikacja zmian rachunków dostawców i weryfikacja na białej liście VAT; polisa od przestępstw finansowych.","Główny Księgowy","Zespół płatności, system bankowości elektronicznej z limitami, SAP, ubezpieczenie crime","Liczba nieuprawnionych płatności (cel: 0); % zmian danych bankowych zweryfikowanych call-backiem (cel: 100%)","22.05.2026"],["Current Regulations & Ethical standards","Gambling Act","Violation of gambling regulations","Organizowanie konkursów, loterii promocyjnych lub gier losowych dla konsumentów albo pracowników (np. w kampaniach OTC lub podczas wydarzeń firmowych) bez wymaganego zezwolenia może stanowić naruszenie przepisów. Czynnikiem ryzyka jest brak konsultacji prawnej mechaniki akcji promocyjnych.","Ustawa o grach hazardowych; Krajowa Administracja Skarbowa","N/D","Krótkoterminowe","Pacjenci i konsumenci, Pracownicy, Organy regulacyjne i urzędnicy publiczni","Marketing / Dział Prawny","Kary pieniężne i odpowiedzialność karnoskarbowa za urządzanie gry bez zezwolenia oraz negatywny odbiór kampanii.","2","2","4","Niskie","Unikanie","Obowiązkowa akceptacja Działu Prawnego dla regulaminów akcji promocyjnych; spółka nie organizuje loterii promocyjnych z elementem losowości.","Dyrektor Marketingu","Radca prawny, procedura akceptacji materiałów promocyjnych","% regulaminów akcji promocyjnych zaakceptowanych przez Dział Prawny przed startem (cel: 100%)","03.03.2026"],["Current Regulations & Ethical standards","ESG & Non‑Financial Reporting","Incorrect or incomplete ESG disclosures in governance area","Niekompletne lub niespójne ujawnienia w obszarze ładu korporacyjnego (G) w raporcie zrównoważonego rozwoju, np. dotyczące polityki antykorupcyjnej, sygnalistów czy struktury nadzoru. Czynnikami ryzyka są nowe wymogi ESRS i rozproszone źródła danych.","Dyrektywa CSRD i standardy ESRS (G1); ustawa o rachunkowości","Lepsza ocena ESG przez banki i inwestorów oraz uporządkowanie danych o ładzie korporacyjnym.","Średnioterminowe","Instytucje finansowe, Organy regulacyjne i urzędnicy publiczni, Klienci i odbiorcy","Finanse / Compliance","Zastrzeżenia biegłego rewidenta w atestacji, sankcje z ustawy o rachunkowości oraz zarzuty greenwashingu.","3","3","9","Średnie","Ograniczanie","Matryca odpowiedzialności za wskaźniki ESRS G1 i przegląd ujawnień przez Compliance przed publikacją; planowane: narzędzie do zbierania danych ESG.","Kierownik ds. ESG","Zespół ESG, Compliance, doradca zewnętrzny, budżet na atestację","% wskaźników G1 z udokumentowanym źródłem danych (cel: 100%); liczba uwag audytora do ujawnień G (cel: 0 istotnych)","30.06.2026"],["Current Regulations & Ethical standards","ISO","Losing ISO certification","Niespełnienie wymagań norm ISO (np. ISO 14001, ISO 45001, ISO 37001) podczas audytu nadzoru lub recertyfikacji może skutkować zawieszeniem certyfikatu. Czynnikami ryzyka są niezamknięte niezgodności z poprzednich audytów i rotacja koordynatorów systemów.","Jednostka certyfikująca; wymagania norm ISO","Wzmocnienie pozycji w przetargach i u partnerów kontraktowych wymagających certyfikacji.","Średnioterminowe","Klienci i odbiorcy, Dostawcy, Organy regulacyjne i urzędnicy publiczni","Jakość / Compliance","Utrata możliwości udziału w przetargach i kontraktach CMO oraz szkoda reputacyjna.","4","1","4","Niskie","Ograniczanie","Harmonogram audytów wewnętrznych i przeglądy zarządzania; rejestr działań korygujących z terminami.","Pełnomocnik ds. Systemów Zarządzania","Audytorzy wewnętrzni, system QMS, budżet na audyty certyfikujące","% niezgodności zamkniętych w terminie (cel: 95%); liczba niezgodności dużych w audycie (cel: 0)","18.09.2026"],["Current Regulations & Ethical standards","AI","AI ethical breaches","Wykorzystanie narzędzi AI (np. generatywnej AI w marketingu, analizie danych pacjentów lub rekrutacji) bez oceny ryzyka może prowadzić do dyskryminacji, naruszenia prywatności lub wprowadzających w błąd treści o produktach leczniczych. Czynnikiem ryzyka jest oddolne używanie publicznych narzędzi AI przez pracowników.","Rozporządzenie UE o sztucznej inteligencji (AI Act); RODO","Bezpieczne wdrożenie AI zwiększające efektywność procesów R&D i operacyjnych.","Długoterminowe","Pracownicy, Pacjenci i konsumenci, Organy regulacyjne i urzędnicy publiczni","IT / Compliance","Kary     if (state.at === 'review' && focusRow) {
      var row = document.getElementById('edit-' + focusRow);
      if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
      focusRow = null;
    }
    if (q && q.type !== 'text' && q.type !== 'email' && q.type !== 'money' && q.type !== 'long' && q.type !== 'sign') syncPressed(q);

    var i = s.indexOf(state.at), qi = q ? vis.indexOf(q) : -1;
    var done = state.at === 'welcome' ? 0 : (state.at === 'review' || state.at === 'dashboard') ? vis.length : qi;
    document.getElementById('bar').style.width = (100 * done / vis.length) + '%';
    document.getElementById('count').textContent = q ? 'Question ' + (qi + 1) + ' of ' + vis.length
      : state.at === 'review' ? 'Review' : state.at === 'dashboard' ? 'Your forms' : vis.length + ' questions';
    document.getElementById('prev').disabled = i <= 0 || state.at === 'dashboard';
    document.getElementById('next').disabled = state.at === 'review' || state.at === 'dashboard';

    var focusEl = stage.querySelector('input.line, textarea.line');
    if (q && q.type === 'sign') focusEl = null;
    var fuEl = q && document.getElementById('f-' + q.id + '__fu');
    if (fuEl && (dir === 'stay' || !stage.querySelector('input.line'))) focusEl = fuEl;
    if (focusEl) { try { focusEl.focus({ preventScroll: true }); } catch (e) { focusEl.focus(); } }
    else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  // Theme: light by default; the choice is remembered in this browser.
  // Save draft: keeps what has been entered in this browser so the person can come back to it. Attached files are not kept.
  var DRAFT_KEY = 'riskDraft:' + document.title, saveBtn = document.getElementById('save-draft'), saveText = document.getElementById('save-draft-text'), saveTimer = null;
  function draftFlash(msg) { clearTimeout(saveTimer); saveText.textContent = msg; saveTimer = setTimeout(function () { saveText.textContent = 'Save draft'; }, 2500); }
  function draftSave() {
    var snap = { started: state.started, items: state.items, draft: state.draft, ownRisks: state.ownRisks, v2: state.v2, v3: state.v3, qf: state.qf, savedAt: Date.now() }, hadFiles = false;
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(snap, function (k, v) {
        if (k === 'files') { if (v && v.length) hadFiles = true; return []; }
        return v;
      }));
      if ((state.files.thoughts || []).length) hadFiles = true;
      draftFlash(hadFiles ? 'Saved, without attached files' : 'Draft saved');
      dashTrack('saved');
    } catch (e) { draftFlash('Could not save here'); }
  }
  function draftClear() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

    var snap = null;
    try { snap = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}

    state.started = true; state.items = snap.items || []; state.draft = snap.draft || null; state.ownRisks = snap.ownRisks || [];
    if (snap.v2) state.v2 = snap.v2; if (snap.v3) state.v3 = snap.v3; if (snap.qf) state.qf = snap.qf;
    state.files.thoughts = [];
    setTimeout(function () { draftFlash('Draft restored'); }, 0);
  }
  saveBtn.addEventListener('click', draftSave);
  // Restart button in the corner: the first click asks, the second one clears everything and returns to the intro.
  var restartBtn = document.getElementById('restart-flow'), restartText = document.getElementById('restart-flow-text'), restartTimer = null;
  function restartIdle() { clearTimeout(restartTimer); restartBtn.classList.remove('ask'); restartText.textContent = 'Restart'; }
  restartBtn.addEventListener('click', function () {
    if (!restartBtn.classList.contains('ask')) {
      restartBtn.classList.add('ask'); restartText.textContent = 'Clear everything? Click again';
      restartTimer = setTimeout(restartIdle, 4000);
      return;
    }
    restartIdle();
    draftClear();
    stopDictation(); stopRecording();
    resetForm(); state.started = false; state.req = null; justSubmitted = null; state.mode = 'form';
    go('welcome', 'back');
  });
  restartBtn.addEventListener('blur', restartIdle);
  var themeBtn = document.getElementById('theme');
  function setTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    themeBtn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  }
  themeBtn.addEventListener('click', function () {
    var dark = !document.documentElement.classList.contains('dark');
    setTheme(dark);
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  });
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    setTheme(saved === 'dark');
  })();
  document.getElementById('prev').addEventListener('click', prev);
  // Two views of the same app: the employee who fills in the form, and the compliance team with its dashboard and tools.
  // The prototype opens in the Compliance team view. A link sent to a person (?t=…) or an area link (#cat-…) opens the form,
  // and so does a browser where Employee was chosen last.
  var role = 'compliance';
  try { if (localStorage.getItem('viewRole') === 'employee') role = 'employee'; } catch (e) {}
  if (/[?&]t=/.test(location.search) || /^#cat-/.test(location.hash)) role = 'employee';
  function roleApply() {
    document.documentElement.classList.toggle('role-employee', role === 'employee');
    document.documentElement.classList.toggle('role-compliance', role === 'compliance');
    document.getElementById('role-employee').setAttribute('aria-pressed', role === 'employee' ? 'true' : 'false');
    document.getElementById('role-compliance').setAttribute('aria-pressed', role === 'compliance' ? 'true' : 'false');
  }
  function roleSet(r) {
    role = r;
    try { localStorage.setItem('viewRole', r); } catch (e) {}
    roleApply();
    if (r === 'employee') { if (state.mode !== 'form') setMode('form'); }
    else if (state.mode === 'form') setMode('dash');
  }
  document.getElementById('role-employee').addEventListener('click', function () { roleSet('employee'); });
  document.getElementById('role-compliance').addEventListener('click', function () { roleSet('compliance'); });
  roleApply();
  document.getElementById('tab-watch').addEventListener('click', function () { setMode('watch'); });
  document.getElementById('tab-track').addEventListener('click', function () { setMode('track'); });
  document.getElementById('tab-dash').addEventListener('click', function () { dash.view = null; if (state.mode === 'dash') render('stay'); else setMode('dash'); });

  var sideBtn = document.getElementById('side-toggle'), sideNav = document.getElementById('side');
  function sideSet(c) { document.documentElement.classList.toggle('side-collapsed', c); sideBtn.setAttribute('aria-expanded', c ? 'false' : 'true'); sideBtn.setAttribute('aria-label', c ? 'Open menu' : 'Collapse menu'); }

  sideBtn.addEventListener('click', function () { var c = !document.documentElement.classList.contains('side-collapsed'); sideSet(c); try { localStorage.setItem('sideCollapsed', c ? '1' : '0'); } catch (e) {} });
  sideNav.addEventListener('click', function (e) { if (window.innerWidth <= 760 && e.target.closest('button')) sideSet(true); });
  document.getElementById('tab-form').addEventListener('click', function () { setMode('form'); });
  document.getElementById('tab-review').addEventListener('click', function () { setMode('review'); });
  // Tagging and Labeling are not open yet: the menu items show "Coming soon" and do nothing.
  document.getElementById('tab-links').addEventListener('click', function () { setMode('links'); });
  document.getElementById('tab-matrix').addEventListener('click', function () { mx.published = null; setMode('matrix'); });
  document.getElementById('tab-syn').addEventListener('click', function () { setMode('syn'); });
  document.getElementById('tab-mxhist').addEventListener('click', function () { mxv.n = null; mxv.only = false; mxv.ask = null; mxv.scroll = 0; setMode('mxhist'); });
  document.getElementById('tab-mxguide').addEventListener('click', function () { setMode('mxguide'); });
  document.getElementById('next').addEventListener('click', next);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || state.mode !== 'form' || !qById(state.at)) return;
    var t = e.target, tag = t.tagName, typing = tag === 'TEXTAREA' || (tag === 'INPUT' && t.type !== 'checkbox');
    if (e.key === 'Enter') {
      if (tag === 'TEXTAREA' && e.shiftKey) return;
      if (t.classList && t.classList.contains('act')) return;
      if (t.id && /__fu$/.test(t.id) && t.value.trim()) { e.preventDefault(); var cq = qById(state.at); if (cq) sendReply(cq); return; }
      e.preventDefault();
      next();
      return;
    }
    if (typing) return;
    var q = qById(state.at);
    if (!q) return;
    var key = e.key.toUpperCase(), hit;
    if (q.type === 'scale') {
      if (/^[1-5]$/.test(key)) { e.preventDefault(); pick(q, key); }
    } else if (q.type === 'yesno' || q.type === 'choice' || q.type === 'multi') {
      hit = opts(q).filter(function (o) { return o.k === key; })[0];
      if (hit) { e.preventDefault(); pick(q, hit.v); }
    }
  });

  function start(data) {
    draftLoad();
    dashTrack('opened');
    if (data && data.answers) state.answers = data.answers;
    if (data && data.fu) state.fu = data.fu;
    if (data && data.edited) state.edited = data.edited;
    if (data && data.editing) state.editing = true;
    if (data && data.mode === 'review') state.mode = data.mode;
    if (data && data.req && data.req.risks) state.req = data.req;
    if (data && data.at) state.at = data.at;
    if (role === 'compliance' && state.mode === 'form' && !state.req) state.mode = 'dash';
    render('fwd');
  }
  var hot = window.claude && window.claude.hot;
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); });
  if (hot && hot.snapshot) hot.snapshot(function () {
    var keep = {}, k;
    for (k in state.answers) if (k !== 'files') keep[k] = state.answers[k];
    return { answers: keep, fu: state.fu, edited: state.edited, editing: state.editing, at: state.at, mode: state.mode, req: state.req };
  });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
